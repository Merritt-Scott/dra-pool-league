                        </div>
                      ) : (
                        <div style={{ marginBottom: 8 }}>
                          <span style={{ fontSize: 11, color: P.dim }}>ELO unlocks after {ELO_MIN - (eloData.played[s.id] || 0)} more match{ELO_MIN - (eloData.played[s.id] || 0) !== 1 ? "es" : ""}</span>
                        </div>
                      )}
                      {!hist.length ? <p style={{ fontSize: 10, color: P.dim, fontStyle: "italic" }}>No match history.</p> : (
                        <div>
                          <p style={{ fontSize: 9, fontWeight: 700, color: P.blue, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>Match History</p>
                          {hist.map(h => {
                            const d = eloData.deltas[h.id];
                            const eloDlt = d ? d[s.id] : null;
                            return (
                              <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 0", borderBottom: "1px solid rgba(21,152,203,.06)" }}>
                                <span style={{ fontSize: 10, fontWeight: 700, color: h.forfeit ? P.dim : h.won ? P.ok : P.bad, width: 14, flexShrink: 0 }}>{h.forfeit ? "FF" : h.won ? "W" : "L"}</span>
                                <span style={{ fontSize: 11, color: P.off, width: 30, flexShrink: 0 }}>{h.forfeit ? "—" : h.myScore + "-" + h.oppScore}</span>
                                <span style={{ fontSize: 11, color: P.white, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>vs {h.oppName}</span>
                                <span style={{ fontSize: 9, fontWeight: 700, color: h.typeLabel && h.typeLabel.startsWith("Bracket") ? P.amber : P.orange, flexShrink: 0 }}>{h.typeLabel}</span>
                                {eloDlt !== null && !h.forfeit && <span style={{ fontSize: 9, fontWeight: 700, color: eloDlt > 0 ? P.ok : P.bad, flexShrink: 0, minWidth: 28, textAlign: "right" }}>{eloDlt > 0 ? "+" : ""}{eloDlt}</span>}
                                <span style={{ fontSize: 9, color: P.dim, flexShrink: 0 }}>{h.completedAt ? fmtDate(h.completedAt) : ""}</span>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            );
            })}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 10 }}>
            {[[P.orange, "Total"], [P.amber, "Box"], [P.blue, "Open"], ["", "\ud83d\udd25 Streak"]].map(([c, t]) => <span key={t} style={{ fontSize: 9, color: P.grey, display: "flex", alignItems: "center", gap: 3 }}>{c && <span style={{ width: 6, height: 6, borderRadius: "50%", background: c }} />}{t}</span>)}
          </div>
        </div>
      )}

      {seasonAwards.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <p style={{ fontSize: 10, fontWeight: 700, letterSpacing: 3, color: P.orange, textTransform: "uppercase", marginBottom: 10 }}>SEASON AWARDS</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {seasonAwards.map((a, i) => (
              <div key={i} style={{ ...gc, padding: 10, marginBottom: 0, borderRadius: 14, textAlign: "center" }}>
                <div style={{ fontSize: 18, marginBottom: 2 }}>{a.icon}</div>
                <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: 2, color: P.orange, textTransform: "uppercase", marginBottom: 3 }}>{a.label}</div>
                <div style={{ fontSize: 12, fontWeight: 600, color: P.white, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</div>
                <div style={{ fontSize: 11, fontWeight: 700, color: P.blue }}>{a.value}</div>
              </div>
            ))}
          </div>
        </div>
      )}


      {!st.seedingPhaseEnded && (
        <div style={{ textAlign: "center", padding: "20px 0 10px" }}>
          <button onClick={() => { setShowJoinPicker(true); setJoinSearch(""); }} style={{ padding: "14px 36px", background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", border: "none", borderRadius: 14, color: P.navy, fontSize: 15, fontWeight: 700, cursor: "pointer", boxShadow: "0 4px 20px rgba(241,138,0,.3)", marginBottom: 16 }}>
            🎱 Join the League
          </button>
          <div style={{ width: 40, height: 1, background: "linear-gradient(90deg,transparent," + P.orange + ",transparent)", margin: "0 auto 10px" }} />
          <p style={{ fontSize: 12, color: P.dim, fontStyle: "italic", fontFamily: "Georgia,serif", letterSpacing: 2 }}>DRAck 'Em Up</p>
        </div>
      )}
      {st.seedingPhaseEnded && (
        <div style={{ textAlign: "center", padding: "16px 0 4px" }}>
          <div style={{ width: 40, height: 1, background: "linear-gradient(90deg,transparent," + P.orange + ",transparent)", margin: "0 auto 8px" }} />
          <p style={{ fontSize: 12, color: P.dim, fontStyle: "italic", fontFamily: "Georgia,serif", letterSpacing: 2 }}>DRAck 'Em Up</p>
        </div>
      )}
      {/* JOIN PICKER MODAL — pick your name from available players → goes to admin approval queue */}
      {showJoinPicker && (() => {
        const avail = [...(st.availablePlayers || [])].sort((a, b) => a.localeCompare(b));
        const pendingNames = new Set((st.pendingPlayers || []).map(p => p.name));
        const q = joinSearch.trim().toLowerCase();
        const filtered = q ? avail.filter(n => n.toLowerCase().includes(q)) : avail;
        return (
          <div onClick={() => setShowJoinPicker(false)} style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,10,20,.92)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, animation: "fadeIn .2s" }}>
            <div onClick={e => e.stopPropagation()} style={{ ...gc, maxWidth: 420, width: "100%", maxHeight: "85vh", display: "flex", flexDirection: "column", marginBottom: 0 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <h3 style={{ fontSize: 17, fontWeight: 600, color: P.white, fontFamily: "Georgia,serif" }}>🎱 Join the League</h3>
                <button onClick={() => setShowJoinPicker(false)} style={{ background: "none", border: "none", color: P.dim, fontSize: 22, cursor: "pointer", lineHeight: 1 }}>×</button>
              </div>
              <p style={{ fontSize: 11, color: P.grey, marginBottom: 10 }}>Pick your name below. Once an admin approves, you'll be added to the league.</p>
              <input value={joinSearch} onChange={e => setJoinSearch(e.target.value)} placeholder="Search for your name..." style={{ ...inpS, width: "100%", marginBottom: 10, fontSize: 13 }} />
              <div style={{ flex: 1, overflowY: "auto", borderRadius: 10, border: "1px solid " + P.gb, background: "rgba(0,20,40,.4)" }}>
                {filtered.length === 0 && <p style={{ fontSize: 12, color: P.dim, textAlign: "center", padding: 20 }}>{q ? "No matches for \"" + joinSearch + "\"" : "No available players — see the admin if you should be on the list."}</p>}
                {filtered.map(name => {
                  const isPending = pendingNames.has(name);
                  return (
                    <div key={name} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderBottom: "1px solid rgba(21,152,203,.06)" }}>
                      <span style={{ flex: 1, fontSize: 13, color: P.off }}>{name}</span>
                      {isPending
                        ? <span style={{ fontSize: 9, fontWeight: 700, color: P.amber, background: "rgba(255,173,51,.12)", border: "1px solid rgba(255,173,51,.3)", borderRadius: 6, padding: "3px 8px", letterSpacing: 1 }}>PENDING</span>
                        : <button onClick={() => { requestJoin(name); }} style={{ padding: "5px 14px", background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", border: "none", borderRadius: 8, color: P.navy, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>That's me</button>}
                    </div>
                  );
                })}
              </div>
              <p style={{ fontSize: 10, color: P.dim, textAlign: "center", marginTop: 8 }}>Tap "That's me" next to your name. The admin will approve your request shortly.</p>
            </div>
          </div>
        );
      })()}
      {profileId && <PlayerCard pid={profileId} st={st} ladder={ladder} gn={gn} eloData={eloData} getPlayerHistory={getPlayerHistory} onClose={() => setProfileId(null)} />}
    </div>
  );
}

// ─── BOXES ───────────────────────────────────────────────────
function BoxesV({ st, gn, ini, logR, ffM }) {
  const [col, setCol] = useState({});
  const [activeMatchId, setActiveMatchId] = useState(null);
  const [s1, setS1] = useState(2); const [s2, setS2] = useState(0);
  const [ffConf, setFfConf] = useState(null);
  const valid = (s1 === 2 && s2 < 2) || (s2 === 2 && s1 < 2);
  const sub = (id, list) => { if (valid) { logR(id, s1, s2, list); setActiveMatchId(null); setS1(2); setS2(0); } };
  const openEntry = (id) => { if (st.seedingPhaseEnded) return; setActiveMatchId(id); setS1(2); setS2(0); setFfConf(null); };
  const ScoreEntry = ({ m, list }) => (
    <div style={{ background: "rgba(0,20,40,.5)", borderRadius: 10, padding: "10px 12px", marginTop: 8, border: "1px solid rgba(21,152,203,.25)" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        {[m.player1, m.player2].map((pid, pi) => {
          const cur = pi === 0 ? s1 : s2, set = pi === 0 ? setS1 : setS2, ov = pi === 0 ? s2 : s1, so = pi === 0 ? setS2 : setS1;
          return (
            <div key={pi} style={{ flex: 1, textAlign: "center" }}>
              <p style={{ fontSize: 13, color: P.white, marginBottom: 8, fontWeight: 600 }}>{gn(pid)}</p>
              <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                {[0, 1, 2].map(v => <button key={v} onClick={() => { set(v); if (v === 2 && ov === 2) so(1); }} style={{ width: 48, height: 48, borderRadius: 12, border: "none", cursor: "pointer", fontSize: 18, fontWeight: 700, background: cur === v ? "linear-gradient(135deg," + P.orange + "," + P.amber + ")" : "rgba(255,255,255,.08)", color: cur === v ? P.navy : P.off, transition: "transform .1s", transform: cur === v ? "scale(1.08)" : "scale(1)" }}>{v}</button>)}
              </div>
            </div>
          );
        })}
      </div>
      {valid && <p style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: P.white, margin: "4px 0 8px" }}>{gn(m.player1)} {s1} – {s2} {gn(m.player2)}</p>}
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => sub(m.id, list)} disabled={!valid} style={{ flex: 1, padding: "10px 0", background: valid ? "linear-gradient(135deg,#34D399,#059669)" : "rgba(255,255,255,.08)", border: "none", borderRadius: 10, color: valid ? "#fff" : P.dim, fontWeight: 700, fontSize: 13, cursor: valid ? "pointer" : "default" }}>{valid ? "Confirm " + s1 + " – " + s2 : "Pick scores"}</button>
        <button onClick={() => setActiveMatchId(null)} style={{ padding: "8px 14px", background: "transparent", border: "1px solid " + P.dim, borderRadius: 8, color: P.dim, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Cancel</button>
        {ffConf !== m.id
          ? <button onClick={() => setFfConf(m.id)} style={{ padding: "8px 14px", background: "transparent", border: "1px solid rgba(248,113,113,.4)", borderRadius: 8, color: P.bad, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Not played</button>
          : <button onClick={() => { ffM(m.id, list); setActiveMatchId(null); setFfConf(null); }} style={{ padding: "8px 14px", background: P.bad, border: "none", borderRadius: 8, color: "#fff", fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Confirm</button>}
      </div>
    </div>
  );
  if (!st.boxes || !st.boxes.length) return <div style={{ textAlign: "center", padding: 50 }}><p style={{ fontSize: 44 }}>{"\ud83d\udcca"}</p><p style={{ color: P.grey, marginBottom: 6 }}>No active round</p><p style={{ fontSize: 11, color: P.dim }}>The admin will start the next round once enough players have checked in.</p></div>;
  const getS = (bm, p1, p2) => { const m = bm.find(m => (m.player1 === p1 && m.player2 === p2) || (m.player1 === p2 && m.player2 === p1)); if (!m) return null; if (!m.completed) return { pending: true, id: m.id }; return { s1: m.player1 === p1 ? m.score1 : m.score2, s2: m.player1 === p1 ? m.score2 : m.score1 }; };
  const togCol = (k) => setCol(c => ({ ...c, [k]: !c[k] }));
  return (
    <div style={{ paddingTop: 16 }}><Tt>Boxes — Round {st.cycleNumber}</Tt>
      {st.seedingPhaseEnded && (
        <div style={{ ...gc, padding: "10px 14px", marginBottom: 12, borderLeft: "3px solid " + P.blue, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 16 }}>🔒</span>
          <span style={{ fontSize: 11, color: P.off, flex: 1 }}>Seeding phase ended — boxes are frozen as their final state.</span>
        </div>
      )}
      {st.boxes.map((box, bi) => { const bm = st.boxMatches.filter(m => m.box === bi); const bs = boxSt(box.players, bm); const pids = bs.map(s => s.id); const done = bm.length > 0 && bm.every(m => m.completed); const isCol = col["box_" + bi];
        const activeM = activeMatchId ? (st.boxMatches || []).find(m => m.id === activeMatchId && m.box === bi) : null;
        return (
          <div key={bi} style={{ marginBottom: 16 }}>
            <div onClick={() => togCol("box_" + bi)} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, cursor: "pointer", userSelect: "none" }}>
              <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: P.orange }}>{box.name.toUpperCase()}</span>
              {(() => { const gpp = gamesPerPlayerForBox(box.players, bm.filter(m => m.completed)); const sf = scaleFactor(gpp); return sf < 1.0 && <span title={`Each player will play ${gpp} games. Match points are scaled by ${sf.toFixed(2)}× so swing-box totals are comparable to 4-person boxes.`} style={{ fontSize: 8, color: P.wc, fontWeight: 700, background: "rgba(196,161,255,.12)", border: "1px solid rgba(196,161,255,.3)", padding: "2px 7px", borderRadius: 10, letterSpacing: 0.5 }}>×{sf.toFixed(2)} SCALING</span>; })()}
              {done && <span style={{ fontSize: 8, color: P.ok, fontWeight: 700, background: "rgba(52,211,153,.1)", padding: "2px 8px", borderRadius: 10 }}>COMPLETE</span>}
              <span style={{ marginLeft: "auto", fontSize: 10, color: P.dim }}>{isCol ? "▶" : "▼"}</span>
            </div>
            {!isCol && <div style={{ ...gc, padding: 0, overflow: "hidden" }}><div style={{ overflowX: "auto" }}><table style={{ borderCollapse: "collapse", width: "100%", minWidth: pids.length * 50 + 130 }}>
              <thead><tr><th style={{ ...gth, textAlign: "left", minWidth: 80, position: "sticky", left: 0, zIndex: 1, background: P.mid }}>Player</th><th style={{ ...gth, width: 36 }}>Pts</th>{pids.map(id => <th key={id} style={{ ...gth, width: 46 }}>{ini(id)}</th>)}</tr></thead>
              <tbody>{pids.map((pid, ri) => (<tr key={pid}><td style={{ ...gtd, textAlign: "left", fontWeight: 600, fontSize: 12, position: "sticky", left: 0, zIndex: 1, background: P.navy }}>{gn(pid)}</td><td style={{ ...gtd, fontWeight: 700, color: P.orange }}>{bs[ri] ? fmtPts(bs[ri].pts) : 0}</td>
                {pids.map(oid => { if (pid === oid) return <td key={oid} style={{ ...gtd, background: "rgba(0,48,82,.4)" }} />; const sc = getS(bm, pid, oid); if (!sc) return <td key={oid} style={{ ...gtd, color: P.dim }}>{"—"}</td>; if (sc.pending) return <td key={oid} onClick={() => openEntry(sc.id)} style={{ ...gtd, background: activeMatchId === sc.id ? "rgba(241,138,0,.3)" : "rgba(241,138,0,.12)", cursor: "pointer" }}><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: P.orange, animation: "pulse 1.8s infinite" }} /></td>; if (sc.s1 === 0 && sc.s2 === 0) return <td key={oid} style={{ ...gtd, color: P.dim, fontSize: 10, fontStyle: "italic" }}>FF</td>; const w = sc.s1 > sc.s2; return <td key={oid} style={{ ...gtd, fontWeight: 700, color: w ? P.ok : P.bad, background: w ? "rgba(52,211,153,.08)" : "rgba(248,113,113,.06)" }}>{sc.s1}-{sc.s2}</td>; })}
              </tr>))}</tbody></table></div>
              {activeM && <div style={{ padding: "0 8px 8px" }}><ScoreEntry m={activeM} list="boxMatches" /></div>}
            </div>}
            {!isCol && done && <div style={{ display: "flex", gap: 12, marginTop: 6 }}><span style={{ fontSize: 10, color: P.orange }}>{"\ud83e\udd47"} {gn(bs[0] ? bs[0].id : "")} (+3)</span>{bs[1] && <span style={{ fontSize: 10, color: P.grey }}>{"\ud83e\udd48"} {gn(bs[1].id)} (+1)</span>}</div>}
          </div>); })}
    </div>
  );
}

// ─── MATCHES (with H2H) ─────────────────────────────────────
function MatchesV({ st, gn, logR, ffM }) {
  const [sc, setSc] = useState(null); const [s1, setS1] = useState(2); const [s2, setS2] = useState(0); const [ffConf, setFfConf] = useState(null);
  const [filterPlayer, setFilterPlayer] = useState(null);
  if (!st.cycleNumber) return <div style={{ textAlign: "center", padding: 50 }}><p style={{ fontSize: 44 }}>{"\ud83d\udcc5"}</p><p style={{ color: P.grey }}>No active round.</p></div>;
  const valid = (s1 === 2 && s2 < 2) || (s2 === 2 && s1 < 2);
  const sub = (id, list) => { if (valid) { logR(id, s1, s2, list); setSc(null); setS1(2); setS2(0); } };
  const rm = (m, list, label, color) => {
    const h2h = getH2H(m.player1, m.player2, st);
    return (
    <div key={m.id} style={{ ...gc, opacity: m.completed && sc !== m.id ? .5 : 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
        <span style={{ fontSize: 8, fontWeight: 700, color, letterSpacing: 3 }}>{label}{m.boxName ? " — " + m.boxName : ""}</span>
        {h2h && <span style={{ fontSize: 9, color: P.dim }}>H2H: {gn(m.player1).split(" ")[0]} {h2h.w1}-{h2h.w2} {gn(m.player2).split(" ")[0]}</span>}
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>{gn(m.player1)}</span>
        <span style={{ fontSize: 14, fontWeight: 700, color: m.completed ? (m.forfeit ? P.dim : P.orange) : P.dim, padding: "0 10px" }}>{m.completed ? (m.forfeit ? "—" : m.score1 + " – " + m.score2) : "vs"}</span>
        <span style={{ flex: 1, fontSize: 14, fontWeight: 600, textAlign: "right" }}>{gn(m.player2)}</span>
      </div>
      {m.completed && m.forfeit && <div style={{ fontSize: 11, color: P.dim, marginTop: 5, fontStyle: "italic" }}>Not played</div>}
      {m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0) && <div style={{ fontSize: 11, color: P.ok, marginTop: 5 }}>{m.score1 > m.score2 ? gn(m.player1) : gn(m.player2)} wins</div>}
      {m.completed && sc !== m.id && !st.seedingPhaseEnded && <button onClick={() => { setSc(m.id); setS1(m.score1 ?? 2); setS2(m.score2 ?? 0); }} style={{ marginTop: 6, padding: "5px 12px", background: "transparent", border: "1px solid " + P.dim, borderRadius: 8, color: P.dim, fontWeight: 600, fontSize: 10, cursor: "pointer" }}>Edit Score</button>}
      {!m.completed && sc !== m.id && ffConf !== m.id && !st.seedingPhaseEnded && <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button onClick={() => { setSc(m.id); setS1(2); setS2(0); }} style={{ ...bpS, width: "auto", display: "inline-block", padding: "8px 18px", marginTop: 0 }}>Log Score</button>
        <button onClick={() => setFfConf(m.id)} style={{ padding: "8px 18px", background: "transparent", border: "1px solid " + P.dim, borderRadius: 10, color: P.dim, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>Forfeit</button>
      </div>}
      {ffConf === m.id && <div style={{ marginTop: 10, padding: "10px 12px", background: "rgba(248,113,113,.08)", border: "1px solid rgba(248,113,113,.3)", borderRadius: 10 }}>
        <p style={{ fontSize: 11, color: P.bad, marginBottom: 8 }}>Mark {gn(m.player1)} vs {gn(m.player2)} as not played?</p>
        <div style={{ display: "flex", gap: 8 }}><button onClick={() => { ffM(m.id, list); setFfConf(null); }} style={{ ...bpS, marginTop: 0, background: P.bad, padding: "6px 16px", fontSize: 11 }}>Confirm</button><button onClick={() => setFfConf(null)} style={bcS}>Cancel</button></div>
      </div>}
      {sc === m.id && <div style={{ marginTop: 12, padding: 14, background: "rgba(0,20,40,.6)", borderRadius: 12, border: "1px solid " + P.gb }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14 }}>
          {["player1", "player2"].map((k, idx) => { const val = idx === 0 ? s1 : s2, sv = idx === 0 ? setS1 : setS2, ov = idx === 0 ? s2 : s1, so = idx === 0 ? setS2 : setS1; return (
            <div key={k} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: P.grey }}>{gn(m[k])}</span>
              <div style={{ display: "flex", gap: 4 }}>{[0, 1, 2].map(v => <button key={v} onClick={() => { sv(v); if (v === 2 && ov === 2) so(1); }} style={{ width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 10, background: val === v ? "linear-gradient(135deg," + P.orange + "," + P.amber + ")" : P.glass, border: "1px solid " + (val === v ? P.orange : P.gb), color: val === v ? P.navy : P.grey, fontSize: 16, fontWeight: 700, cursor: "pointer", transform: val === v ? "scale(1.08)" : "scale(1)" }}>{v}</button>)}</div>
            </div>); })}
        </div>
        {valid ? <button onClick={() => sub(m.id, list)} style={bpS}>Confirm {s1} – {s2}</button> : <p style={{ fontSize: 10, color: P.dim, textAlign: "center", marginTop: 8 }}>One player must win 2</p>}
        <button onClick={() => setSc(null)} style={bcS}>Cancel</button>
      </div>}
    </div>);
  };
  const [col, setCol] = useState({ done: true });
  const togCol = (k) => setCol(c => ({ ...c, [k]: !c[k] }));
  const SecHdr = ({ k, label }) => (
    <div onClick={() => togCol(k)} style={{ display: "flex", alignItems: "center", cursor: "pointer", userSelect: "none", margin: "18px 0 8px" }}>
      <span style={{ fontSize: 9, fontWeight: 700, color: P.orange, letterSpacing: 3, textTransform: "uppercase" }}>{label}</span>
      <span style={{ marginLeft: 8, fontSize: 10, color: P.dim }}>{col[k] ? "▶" : "▼"}</span>
    </div>
  );
  const bP = (st.boxMatches || []).filter(m => !m.completed), bD = (st.boxMatches || []).filter(m => m.completed);
  const allM = [...bP, ...bD];
  const allMPIds = [...new Set(allM.flatMap(m => [m.player1, m.player2]))];
  const allMPlayers = allMPIds.map(id => ({ id, name: gn(id) })).sort((a, b) => a.name.localeCompare(b.name));
  const showM = (m) => !filterPlayer || m.player1 === filterPlayer || m.player2 === filterPlayer;
  const fbP = bP.filter(showM), fbD = bD.filter(showM);
  return (<div style={{ paddingTop: 16 }}><Tt>Round {st.cycleNumber} Matches</Tt>
    {st.seedingPhaseEnded && (
      <div style={{ ...gc, padding: "10px 14px", marginBottom: 12, borderLeft: "3px solid " + P.blue, display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 16 }}>🔒</span>
        <span style={{ fontSize: 11, color: P.off, flex: 1 }}>Seeding phase ended — matches are read-only.</span>
      </div>
    )}
    {allMPlayers.length > 0 && (
      <select value={filterPlayer || ""} onChange={e => setFilterPlayer(e.target.value || null)} style={{ width: "100%", background: "rgba(0,20,40,.6)", border: "1px solid rgba(21,152,203,.3)", borderRadius: 10, color: filterPlayer ? P.off : P.dim, fontSize: 13, padding: "10px 14px", marginBottom: 12, appearance: "none", WebkitAppearance: "none", cursor: "pointer" }}>
        <option value="">All matches</option>
        {allMPlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
      </select>
    )}
    {fbP.length > 0 && <div><SecHdr k="bp" label={"Box — Pending (" + fbP.length + ")"} />{!col["bp"] && fbP.map(m => rm(m, "boxMatches", "BOX", P.orange))}</div>}
    {fbD.length > 0 && <div><SecHdr k="done" label={"Completed (" + fbD.length + ")"} />{!col["done"] && <div>{fbD.map(m => rm(m, "boxMatches", "BOX", P.orange))}</div>}</div>}
  </div>);
}

// ─── BRACKET ─────────────────────────────────────────────────
// Locked view if seeding hasn't ended; full bracket display otherwise.
function BracketV({ st, gn, ladder, recordBracketMatch, isAdmin }) {
  const [selectedMatch, setSelectedMatch] = useState(null);
  const [s1, setS1] = useState("");
  const [s2, setS2] = useState("");

  // ─── LOCKED STATE ───
  if (!st.seedingPhaseEnded || !st.bracket) {
    return (
      <div style={{ paddingTop: 16 }}>
        <Tt>Bracket</Tt>
        <div style={{ ...gc, textAlign: "center", padding: "40px 20px" }}>
          <div style={{ fontSize: 48, marginBottom: 16, opacity: .4 }}>🔒</div>
          <h3 style={{ fontSize: 16, fontWeight: 700, color: P.white, marginBottom: 10, fontFamily: "Georgia,serif" }}>Bracket Locked</h3>
          <p style={{ fontSize: 13, color: P.off, marginBottom: 6, lineHeight: 1.5 }}>Bracket unlocks after seeding rounds complete.</p>
          <p style={{ fontSize: 11, color: P.dim, marginTop: 14 }}>The admin will end the seeding phase when ready, and the bracket will be seeded by cumulative points.</p>
        </div>
      </div>
    );
  }

  const br = st.bracket;
  const champ = st.champion;
  const numRounds = br.rounds.length;

  // ─── ADAPTIVE LAYOUT CONSTANTS ───
  // Tighten the layout for larger brackets so they fit better. A 32-player
  // bracket has 16 R1 matches stacked vertically — at full size it'd be
  // ~1300px tall and ~1000px wide, which is unwieldy. Scale down accordingly.
  const isLarge = br.size >= 16;
  const isXLarge = br.size >= 32;
  const MATCH_H = isXLarge ? 48 : isLarge ? 56 : 64;
  const MATCH_GAP = isXLarge ? 10 : isLarge ? 14 : 18;
  const COL_W = isXLarge ? 158 : isLarge ? 168 : 178;
  const COL_GAP = isXLarge ? 28 : isLarge ? 32 : 38;
  const SLOT = MATCH_H + MATCH_GAP;
  const r1Count = br.rounds[0].matches.length;
  const treeHeight = r1Count * SLOT;
  const treeWidth = numRounds * COL_W + (numRounds - 1) * COL_GAP;

  // Compute (x, y, height) for every match across all rounds.
  const matchPositions = {};
  br.rounds.forEach((round, ri) => {
    const slotsPerMatch = Math.pow(2, ri);
    round.matches.forEach((m, mi) => {
      const firstSlot = mi * slotsPerMatch;
      const yCenter = (firstSlot + slotsPerMatch / 2) * SLOT;
      matchPositions[m.id] = {
        x: ri * (COL_W + COL_GAP),
        yCenter,
        top: yCenter - MATCH_H / 2,
        ri, mi,
      };
    });
  });

  const scoreInput = { background: "rgba(255,255,255,.06)", border: "1px solid rgba(255,255,255,.18)", borderRadius: 8, padding: "6px 8px", color: P.white, fontSize: 15, fontWeight: 700, width: 44, textAlign: "center", fontFamily: "DM Sans,sans-serif" };

  // ─── MATCH RECORD MODAL ───
  const matchModal = selectedMatch && (() => {
    const m = selectedMatch;
    const p1Name = gn(m.p1);
    const p2Name = gn(m.p2);
    const submit = (winnerId) => {
      const n1 = parseInt(s1, 10), n2 = parseInt(s2, 10);
      if (isNaN(n1) || isNaN(n2) || n1 < 0 || n2 < 0 || n1 > 3 || n2 > 3 || n1 === n2) { alert("Best of 5: scores must be 0-3 and not equal"); return; }
      const winnerScore = winnerId === m.p1 ? n1 : n2;
      const loserScore = winnerId === m.p1 ? n2 : n1;
      if (winnerScore !== 3) { alert("Winner must have 3 racks (best of 5)"); return; }
      if (loserScore >= winnerScore) { alert("Winner's score must be higher"); return; }
      recordBracketMatch(m.id, winnerId, n1, n2);
      setSelectedMatch(null); setS1(""); setS2("");
    };
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,10,20,.85)", backdropFilter: "blur(6px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={() => { setSelectedMatch(null); setS1(""); setS2(""); }}>
        <div style={{ ...gc, maxWidth: 380, width: "100%", padding: 20 }} onClick={e => e.stopPropagation()}>
          <h3 style={{ fontSize: 14, fontWeight: 700, color: P.orange, marginBottom: 4, letterSpacing: 1.5, textTransform: "uppercase" }}>Round {m.round} · Best of 5</h3>
          <p style={{ fontSize: 11, color: P.grey, marginBottom: 16 }}>Enter racks won by each player (first to 3 wins)</p>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, padding: "10px 12px", background: P.glass, borderRadius: 10, border: "1px solid " + P.gb }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 9, color: P.dim, letterSpacing: 1, marginBottom: 2 }}>SEED {m.p1Seed || "?"}</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: P.white }}>{p1Name}</div>
            </div>
            <input type="number" min="0" max="3" value={s1} onChange={e => setS1(e.target.value)} style={scoreInput} placeholder="0" />
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, padding: "10px 12px", background: P.glass, borderRadius: 10, border: "1px solid " + P.gb }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 9, color: P.dim, letterSpacing: 1, marginBottom: 2 }}>SEED {m.p2Seed || "?"}</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: P.white }}>{p2Name}</div>
            </div>
            <input type="number" min="0" max="3" value={s2} onChange={e => setS2(e.target.value)} style={scoreInput} placeholder="0" />
          </div>
          <p style={{ fontSize: 10, color: P.dim, marginBottom: 8, textAlign: "center" }}>Tap the winner below to confirm</p>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => submit(m.p1)} style={{ flex: 1, padding: "10px 8px", background: "linear-gradient(135deg," + P.ok + ",#0e9c6f)", border: "none", borderRadius: 10, color: P.white, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{p1Name} wins</button>
            <button onClick={() => submit(m.p2)} style={{ flex: 1, padding: "10px 8px", background: "linear-gradient(135deg," + P.ok + ",#0e9c6f)", border: "none", borderRadius: 10, color: P.white, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{p2Name} wins</button>
          </div>
          <button onClick={() => { setSelectedMatch(null); setS1(""); setS2(""); }} style={{ width: "100%", marginTop: 10, padding: "8px", background: "transparent", border: "1px solid " + P.dim, borderRadius: 10, color: P.dim, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Cancel</button>
        </div>
      </div>
    );
  })();

  // ─── MATCH CARD ───
  const renderMatchCard = (m, isFinalMatch) => {
    const p1Name = m.p1 ? gn(m.p1) : (m.isBye ? "BYE" : "TBD");
    const p2Name = m.p2 ? gn(m.p2) : (m.isBye ? "BYE" : "TBD");
    const canRecord = isAdmin && !m.completed && m.p1 && m.p2 && !m.isBye;
    const w = m.winner;
    const p1Won = w && w === m.p1;
    const p2Won = w && w === m.p2;
    const accentDim = isFinalMatch ? "rgba(241,138,0,.25)" : "rgba(21,152,203,.25)";
    const nameSize = isXLarge ? 10.5 : isLarge ? 11 : 11.5;
    const rowPadV = isXLarge ? 5 : 7;

    const playerRow = (name, seed, isWinner, isLoser, score, isWaiting) => (
      <div style={{
        display: "flex", alignItems: "center", gap: 6,
        padding: `${rowPadV}px 8px`,
        background: isWinner ? (isFinalMatch ? "linear-gradient(90deg,rgba(241,138,0,.18),rgba(241,138,0,.04))" : "linear-gradient(90deg,rgba(52,211,153,.14),rgba(52,211,153,.02))") : "transparent",
        borderLeft: isWinner ? "3px solid " + (isFinalMatch ? P.orange : P.ok) : "3px solid transparent",
        opacity: isLoser ? .42 : 1,
      }}>
        <span style={{
          fontSize: 8, fontWeight: 800, letterSpacing: 0.5, minWidth: 16,
          textAlign: "center", padding: "1px 4px", borderRadius: 3,
          background: seed ? "rgba(255,255,255,.06)" : "transparent",
          color: seed ? P.dim : "transparent",
          border: seed ? "1px solid rgba(255,255,255,.08)" : "1px solid transparent",
        }}>{seed ? seed : "—"}</span>
        <span style={{
          flex: 1, fontSize: nameSize,
          fontWeight: isWinner ? 700 : 500,
          color: isWaiting ? P.dim : (isWinner ? P.white : P.off),
          fontStyle: isWaiting ? "italic" : "normal",
          overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis",
        }}>{name}</span>
        {(score !== null && score !== undefined) && (
          <span style={{
            fontSize: isXLarge ? 12 : 13, fontWeight: 800,
            color: isWinner ? (isFinalMatch ? P.orange : P.ok) : P.dim,
            minWidth: 14, textAlign: "right",
            fontFamily: "Georgia,serif",
          }}>{score}</span>
        )}
      </div>
    );

    return (
      <div
        key={m.id}
        onClick={canRecord ? () => { setSelectedMatch(m); setS1(""); setS2(""); } : undefined}
        style={{
          position: "absolute",
          left: matchPositions[m.id].x,
          top: matchPositions[m.id].top,
          width: COL_W,
          height: MATCH_H,
          background: m.completed ? "linear-gradient(180deg,rgba(0,28,52,.85),rgba(0,18,38,.95))" : "rgba(0,24,46,.6)",
          borderRadius: 8,
          border: "1px solid " + (canRecord ? "rgba(241,138,0,.5)" : isFinalMatch && !m.completed ? "rgba(241,138,0,.35)" : accentDim),
          boxShadow: canRecord
            ? "0 0 0 1px rgba(241,138,0,.18), 0 4px 12px rgba(0,0,0,.4)"
            : m.completed ? "0 2px 8px rgba(0,0,0,.3)" : "0 2px 6px rgba(0,0,0,.25)",
          cursor: canRecord ? "pointer" : "default",
          overflow: "hidden",
          transition: "transform .15s, box-shadow .15s",
          animation: canRecord ? "bracketPulse 2.4s ease-in-out infinite" : "none",
        }}
        onMouseEnter={canRecord ? e => { e.currentTarget.style.transform = "translateY(-1px)"; } : undefined}
        onMouseLeave={canRecord ? e => { e.currentTarget.style.transform = "translateY(0)"; } : undefined}
      >
        {playerRow(p1Name, m.p1Seed, m.completed && p1Won, m.completed && !p1Won && !m.isBye, m.score1, !m.p1 && !m.isBye)}
        <div style={{ height: 1, background: "rgba(255,255,255,.06)" }} />
        {playerRow(p2Name, m.p2Seed, m.completed && p2Won, m.completed && !p2Won && !m.isBye, m.score2, !m.p2 && !m.isBye)}
        {canRecord && (
          <div style={{ position: "absolute", top: 3, right: 5, fontSize: 7, fontWeight: 800, color: P.orange, letterSpacing: 1, background: "rgba(241,138,0,.12)", padding: "1px 5px", borderRadius: 3, border: "1px solid rgba(241,138,0,.3)" }}>TAP</div>
        )}
        {m.isBye && (
          <div style={{ position: "absolute", top: 3, right: 5, fontSize: 7, fontWeight: 800, color: P.dim, letterSpacing: 1, background: "rgba(255,255,255,.04)", padding: "1px 5px", borderRadius: 3, border: "1px solid rgba(255,255,255,.06)" }}>BYE</div>
        )}
      </div>
    );
  };

  // ─── CONNECTOR LINES (SVG) ───
  const connectors = [];
  br.rounds.forEach((round, ri) => {
    if (ri === 0) return;
    round.matches.forEach((m, mi) => {
      const dest = matchPositions[m.id];
      const srcTop = matchPositions[br.rounds[ri - 1].matches[mi * 2].id];
      const srcBot = matchPositions[br.rounds[ri - 1].matches[mi * 2 + 1].id];
      const x1 = srcTop.x + COL_W;
      const x2 = dest.x;
      const midX = x1 + (x2 - x1) / 2;
      const isPathToFinal = ri === numRounds - 1;
      const color = isPathToFinal ? "rgba(241,138,0,.4)" : "rgba(21,152,203,.3)";
      const sourceCompleted = br.rounds[ri - 1].matches[mi * 2].completed || br.rounds[ri - 1].matches[mi * 2 + 1].completed;
      const stroke = sourceCompleted ? (isPathToFinal ? "rgba(241,138,0,.7)" : "rgba(52,211,153,.55)") : color;
      const strokeWidth = sourceCompleted ? 1.5 : 1;
      connectors.push(
        <g key={m.id + "-conn"}>
          <line x1={x1} y1={srcTop.yCenter} x2={midX} y2={srcTop.yCenter} stroke={stroke} strokeWidth={strokeWidth} />
          <line x1={x1} y1={srcBot.yCenter} x2={midX} y2={srcBot.yCenter} stroke={stroke} strokeWidth={strokeWidth} />
          <line x1={midX} y1={srcTop.yCenter} x2={midX} y2={srcBot.yCenter} stroke={stroke} strokeWidth={strokeWidth} />
          <line x1={midX} y1={dest.yCenter} x2={x2} y2={dest.yCenter} stroke={stroke} strokeWidth={strokeWidth} />
        </g>
      );
    });
  });

  const roundLabel = (ri) => {
    if (ri === numRounds - 1) return "FINAL";
    if (ri === numRounds - 2) return "SEMIFINAL";
    if (ri === numRounds - 3) return "QUARTERFINAL";
    if (ri === numRounds - 4) return "ROUND OF 16";
    return "ROUND " + (ri + 1);
  };

  // The bracket is wider than the app's normal 600px content column. Break
  // out of that constraint by using viewport-width with a negative left margin.
  // On narrow screens this becomes a no-op (the bracket scrolls horizontally
  // within the visible area).
  const breakoutStyle = {
    position: "relative",
    left: "50%",
    right: "50%",
    marginLeft: "-50vw",
    marginRight: "-50vw",
    width: "100vw",
    maxWidth: "100vw",
    padding: "0 14px",
    boxSizing: "border-box",
  };

  return (
    <div style={{ paddingTop: 16 }}>
      <style>{`
        @keyframes bracketPulse {
          0%, 100% { box-shadow: 0 0 0 1px rgba(241,138,0,.18), 0 4px 12px rgba(0,0,0,.4); }
          50% { box-shadow: 0 0 0 2px rgba(241,138,0,.42), 0 4px 16px rgba(241,138,0,.18); }
        }
        @keyframes trophyShine {
          0%, 100% { filter: drop-shadow(0 0 8px rgba(241,138,0,.4)); }
          50% { filter: drop-shadow(0 0 18px rgba(255,173,51,.7)); }
        }
      `}</style>
      <Tt>Tournament Bracket</Tt>
      <p style={{ fontSize: 12, color: P.grey, marginBottom: 16, padding: "0 16px" }}>
        Single elimination · Best of 5 · {br.size}-player bracket
      </p>

      {champ && (
        <div style={{
          ...gc, textAlign: "center", padding: "24px 20px", marginBottom: 18,
          background: "radial-gradient(circle at 50% 0%, rgba(241,138,0,.28), rgba(255,173,51,.06) 60%, transparent), linear-gradient(180deg, rgba(0,28,52,.6), rgba(0,18,38,.9))",
          border: "2px solid " + P.orange,
          boxShadow: "0 0 40px rgba(241,138,0,.25), inset 0 1px 0 rgba(255,173,51,.2)",
        }}>
          <div style={{ fontSize: 44, marginBottom: 6, animation: "trophyShine 2.5s ease-in-out infinite" }}>🏆</div>
          <div style={{ fontSize: 10, color: P.amber, letterSpacing: 5, fontWeight: 800, marginBottom: 6 }}>CHAMPION</div>
          <div style={{ fontSize: 26, fontWeight: 700, color: P.white, fontFamily: "Georgia,serif", letterSpacing: 0.5 }}>{champ.name}</div>
          <div style={{ fontSize: 11, color: P.off, marginTop: 6, letterSpacing: 2 }}>{(champ.season || "Summer 2026").toUpperCase()}</div>
          <div style={{ marginTop: 12, fontSize: 10, color: P.amber, letterSpacing: 3, opacity: .7 }}>— DRA POOL LEAGUE —</div>
        </div>
      )}

      {/* Breakout container — escapes the 600px main column */}
      <div style={breakoutStyle}>
        <div style={{
          ...gc,
          padding: "0 0 18px",
          overflowX: "auto",
          WebkitOverflowScrolling: "touch",
          background: "linear-gradient(180deg, rgba(0,18,38,.4), rgba(0,12,28,.6))",
        }}>
          {/* Round labels row */}
          <div style={{ display: "flex", padding: "14px 0 12px", borderBottom: "1px solid " + P.gb, minWidth: treeWidth + 32, marginBottom: 8 }}>
            {br.rounds.map((round, ri) => {
              const done = round.matches.filter(m => m.completed).length;
              const total = round.matches.length;
              const isFinal = ri === numRounds - 1;
              return (
                <div key={ri} style={{ width: COL_W, marginLeft: ri === 0 ? 16 : COL_GAP, textAlign: "center" }}>
                  <div style={{
                    fontSize: 10, fontWeight: 800,

                  <div style={{ fontSize: 9, color: P.dim, fontWeight: 600 }}>{done}/{total}</div>

          <div style={{ position: "relative", width: treeWidth + 32, height: treeHeight, marginLeft: 16, marginTop: 4 }}>

            >

            </svg>

  );

function CheckInV({ st, ladder, togCI, selLast, autoOpen, onAutoOpenDone }) {
  const [search, setSearch] = useState("");
  const [showSignUp, setShowSignUp] = useState(true);
  const [showRemaining, setShowRemaining] = useState(false);
  const [confirmJoinId, setConfirmJoinId] = useState(null);
  const signupRef = React.useRef(null);
  React.useEffect(() => {
    if (!autoOpen) return;
    setShowSignUp(true);
    setShowRemaining(true);
    setTimeout(() => { signupRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }); }, 150);
    if (onAutoOpenDone) onAutoOpenDone();
  }, [autoOpen]);
  // Playing This Round — players in the current active round
  const currentIds = new Set((st.boxes || []).flatMap(b => b.players));
  const currentPlayers = ladder.filter(s => currentIds.has(s.id));

  // Sign Up for Next Round
  const playing = ladder.filter(s => st.checkedIn.includes(s.id));
  const notPlaying = ladder.filter(s => !st.checkedIn.includes(s.id));
  const boxIds = new Set((st.boxMatches || []).filter(m => m.completed && !m.forfeit).flatMap(m => [m.player1, m.player2]));
  const returning = playing.filter(s => boxIds.has(s.id));
  const newPlayers = playing.filter(s => !boxIds.has(s.id));
  const other = [];
  const filtered = search.trim() ? notPlaying.filter(s => s.name.toLowerCase().includes(search.toLowerCase())) : notPlaying;

  const secBtn = (label, show, onToggle, count) => (
    <div onClick={onToggle} style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 0 6px", cursor: "pointer", userSelect: "none" }}>
      <span style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: P.dim }}>{show ? "\u25bc" : "\u25b6"}</span>
      <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: P.dim, textTransform: "uppercase" }}>{label}</span>
      {count !== undefined && <span style={{ fontSize: 10, color: P.grey }}>({count})</span>}
      <div style={{ flex: 1, height: 1, background: P.gb }} />
    </div>
  );

  const playerRow = (s, action, actionLabel, actionStyle, badge) => (
    <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 4px", borderBottom: "1px solid rgba(21,152,203,.06)" }}>
      {badge && <span style={{ fontSize: 8, fontWeight: 700, color: badge === "NEW" ? P.orange : P.ok, background: badge === "NEW" ? "rgba(241,138,0,.15)" : "rgba(52,211,153,.12)", border: badge === "NEW" ? "1px solid rgba(241,138,0,.3)" : "1px solid rgba(52,211,153,.35)", borderRadius: 4, padding: "1px 5px", letterSpacing: 1 }}>{badge}</span>}
      <span style={{ flex: 1, fontSize: 13 }}>{s.name}</span>
      {action && <button onClick={() => action(s.id)} style={actionStyle}>{actionLabel}</button>}
    </div>
  );

  const leaveBtn = { padding: "4px 12px", background: "transparent", border: "1px solid " + P.bad, borderRadius: 8, color: P.bad, fontSize: 10, fontWeight: 700, cursor: "pointer" };
  const joinBtn = { padding: "4px 12px", background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", border: "none", borderRadius: 8, color: P.navy, fontSize: 10, fontWeight: 700, cursor: "pointer" };

  return (<div style={{ paddingTop: 16 }}>
    {confirmJoinId !== null && (
      <div style={{ position: "fixed", inset: 0, zIndex: 50, background: "rgba(0,10,20,.85)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ ...gc, maxWidth: 320, width: "100%", textAlign: "center" }}>
          <p style={{ fontSize: 16, fontWeight: 700, color: P.white, marginBottom: 8 }}>Join the League?</p>
          <p style={{ fontSize: 13, color: P.grey, marginBottom: 20 }}>{(st.players.find(p => p.id === confirmJoinId) || {}).name || "This player"} will be signed up for the next round.</p>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => { togCI(confirmJoinId); setConfirmJoinId(null); }} style={{ flex: 1, padding: "12px 0", background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", border: "none", borderRadius: 12, color: P.navy, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Yes, I'm in!</button>
            <button onClick={() => setConfirmJoinId(null)} style={{ flex: 1, padding: "12px 0", background: "transparent", border: "1px solid " + P.dim, borderRadius: 12, color: P.grey, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>No</button>
          </div>
        </div>
      </div>
    )}
    <Tt>Players</Tt>
    <p style={{ fontSize: 12, color: P.grey, marginBottom: 10 }}>{st.checkedIn.length} player{st.checkedIn.length !== 1 ? "s" : ""} signed up for next round</p>

    {/* Playing This Round — read-only */}
    {st.cycleNumber > 0 && currentPlayers.length > 0 && (<>
      {secBtn("Playing This Round", true, () => {}, currentPlayers.length)}
      <div style={gc}>
        {currentPlayers.map(s => (
          <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 4px", borderBottom: "1px solid rgba(21,152,203,.06)" }}>
            <span style={{ flex: 1, fontSize: 13 }}>{s.name}</span>
            <span style={{ fontSize: 9, color: P.dim }}>active</span>
          </div>
        ))}
      </div>
    </>)}

    {/* Signed Up for Next Round */}
    {secBtn("Signed Up for Next Round", showSignUp, () => setShowSignUp(v => !v), playing.length)}
    {showSignUp && (
      <div style={gc}>
        {playing.length === 0 && <p style={{ fontSize: 12, color: P.dim, textAlign: "center", padding: "8px 0" }}>No one signed up yet.</p>}
        {returning.map(s => playerRow(s, togCI, "Leave", leaveBtn, "RETURNING"))}
        {newPlayers.map(s => playerRow(s, togCI, "Leave", leaveBtn, "NEW"))}
        {other.map(s => playerRow(s, togCI, "Leave", leaveBtn, null))}
      </div>
    )}

    {/* Not Signed Up — active players who haven't checked in for the next round.
        Lets them rejoin without going through admin approval again. */}
    {notPlaying.length > 0 && (<>
      {secBtn("Not Signed Up", showRemaining, () => setShowRemaining(v => !v), notPlaying.length)}
      {showRemaining && (
        <div style={gc}>
          {notPlaying.map(s => playerRow(s, togCI, "Join", joinBtn, null))}
        </div>
      )}
    </>)}
  </div>);
}

    </div>
  );
}

      <div style={{ padding: "0 16px", display: "flex", flexDirection: "column", gap: 4 }}>

        <button onClick={() => { setShowBoxPreview(false); setSwapSrc(null); setManuallyMoved(new Set()); }} style={bcS}>Cancel</button>
      </div>
    </div>
  );

  return (<div style={{ paddingTop: 16 }}><Tt>Admin <span style={{ fontSize: 11, color: P.ok }}>{"\ud83d\udd13"}</span></Tt>
    <div style={gc}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: showPlayers ? 8 : 0 }}>

      </div>
      {showPlayers && <div>
        <p style={{ fontSize: 10, color: P.dim, marginBottom: 8 }}>{(st.availablePlayers || []).length} available · {(st.pendingPlayers || []).length} pending approval</p>
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}><input value={nm} onChange={e => setNm(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && nm.trim()) { addP(nm); setNm(""); } }} placeholder="New player..." style={inpS} /><button onClick={() => { if (nm.trim()) { addP(nm); setNm(""); } }} style={{ padding: "10px 18px", background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", color: P.navy, border: "none", borderRadius: 10, fontWeight: 700, cursor: "pointer" }}>Add</button></div>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search..." style={{ ...inpS, width: "100%", marginBottom: 8, flex: "none", fontSize: 12 }} />
        <div style={{ maxHeight: 250, overflowY: "auto" }}>{filtLad.map((s, i) => (

            <span style={{ fontSize: 11, color: P.orange, fontWeight: 700, width: 24 }}>#{ladder.indexOf(s) + 1}</span>
            <span style={{ flex: 1, fontSize: 13 }}>{s.name}</span>
            <span style={{ fontSize: 10, color: P.dim }}>{fmtPts(s.points)}pts</span>
            {rmId === s.id ? (<div style={{ display: "flex", gap: 3 }}><button onClick={() => { rmP(s.id); setRmId(null); }} style={{ padding: "3px 8px", background: P.bad, color: "#fff", border: "none", borderRadius: 6, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>Remove</button><button onClick={() => setRmId(null)} style={{ padding: "3px 8px", background: P.mid, color: P.grey, border: "none", borderRadius: 6, fontSize: 10, cursor: "pointer" }}>Keep</button></div>) : <button onClick={() => setRmId(s.id)} style={{ background: "transparent", border: "none", color: P.dim, fontSize: 16, cursor: "pointer" }}>{"\u00d7"}</button>}
          </div>))}</div>
      </div>}
    </div>

    {(st.pendingPlayers || []).length > 0 && (
      <div style={{ ...gc, background: "rgba(255,173,51,.06)", borderColor: "rgba(255,173,51,.3)" }}>
        <h4 style={{ fontSize: 15, fontWeight: 600, color: P.amber, fontFamily: "Georgia,serif", marginBottom: 4 }}>Pending Approval ({st.pendingPlayers.length})</h4>
        <p style={{ fontSize: 11, color: P.grey, marginBottom: 10 }}>These players requested to join. Approve adds them to active players; reject sends them back to the available list.</p>
        {st.pendingPlayers.map(p => (
          <div key={p.name} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 4px", borderBottom: "1px solid rgba(255,173,51,.1)" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, color: P.white, fontWeight: 600 }}>{p.name}</div>
              <div style={{ fontSize: 10, color: P.dim }}>Signed up {fmtDate(p.requestedAt)} at {new Date(p.requestedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
            </div>
            <button onClick={() => approvePlayer(p.name)} style={{ padding: "5px 12px", background: "linear-gradient(135deg,#34D399,#059669)", border: "none", borderRadius: 8, color: "#fff", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Approve</button>
            <button onClick={() => rejectPlayer(p.name)} style={{ padding: "5px 12px", background: "transparent", border: "1px solid " + P.bad, borderRadius: 8, color: P.bad, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Reject</button>
          </div>
