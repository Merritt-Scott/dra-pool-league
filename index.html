// Build randomly-shuffled boxes from a list of checked-in player IDs.
// `lad` is the ladder; we use it only to filter to checked-in IDs. The order
// is then shuffled — group assignment carries NO information from previous
// rounds (no promotion/relegation, no ELO seeding). Every round is a fresh draw.
//
// Sizing:
//   - N divisible by 4 → all boxes of 4
//   - N not divisible by 4 → one box has 3, 5, or 6 players; the rest have 4
// All boxes are labeled "Box 1", "Box 2", ... — no "Swing Box" name.
// The `isSwing` flag is preserved on the last box for downstream code that
// inspects it, but it no longer affects display.
function buildBoxes(ids, lad, randomize = true) {
  // `randomize` arg kept for back-compat with old call sites; defaults to true
  // since random is now the only supported mode.
  let rk = lad.filter(s => ids.includes(s.id));
  rk = shuf(rk);
  const bx = [];
  let i = 0;
  while (i < rk.length) {
    const rem = rk.length - i;
    if (rem <= 6) {
      // Last group — takes whatever's left (3, 5, or 6 if not divisible by 4; else 4)
      bx.push({ name: "Box " + (bx.length + 1), isSwing: true, players: rk.slice(i).map(s => s.id) });
      break;

  if (bx.length && !bx[bx.length - 1].isSwing) {
    bx[bx.length - 1].isSwing = true;
  }
  return bx;
}

// ─── Swing-box point scaling ──────────────────────────────────────────────
// Every player in a 4-person box plays exactly 3 games. Swing boxes can have
// 5, 6, or 7 players, so each player plays 4, 5, or 6 games respectively —
// more games = more chances to earn points = unfair point inflation.
//
// To make seeding fair across box sizes, we scale match points (win/loss)
// by a factor of (3 / actualGamesPerPlayer). For 4-person boxes the factor
// is always 1.0 so they're unaffected. For a 5-person swing box it's 0.75,
// a 6-box is 0.60, a 7-box is 0.50.
//
// What IS scaled: the win-points (4 for win-with-loss, 5 for shutout) and
// loser-points (0 for shutout-loss, 2 for win-with-rack).
// What is NOT scaled: 1st-place bonus (+3), 2nd-place bonus (+1), forfeit
// penalty (-1). Positional bonuses earn the same in any box size because
// finishing top of a 6-box is harder than top of a 4-box.
//
// Computes from match-list shape so it works for current AND historical rounds.
function gamesPerPlayerForBox(boxPlayerIds, matchesInBox) {
  if (!boxPlayerIds || boxPlayerIds.length === 0) return 3;
  const counts = {};
  boxPlayerIds.forEach(id => { counts[id] = 0; });
  matchesInBox.forEach(m => {
    if (counts[m.player1] !== undefined) counts[m.player1]++;
    if (counts[m.player2] !== undefined) counts[m.player2]++;
  });

  // matches aren't scheduled yet — we look at what the schedule WILL be when
  // matches are present, which mirrors the full round-robin pattern.
  const vals = Object.values(counts).filter(v => v > 0);

}
function scaleFactor(gamesPerPlayer) {

  // total scales as if 3 games were played.
  if (!gamesPerPlayer || gamesPerPlayer <= 3) return 1.0;
  return 3 / gamesPerPlayer;
}
// Display helper — 1 decimal place, but drop ".0" for clean integers
function fmtPts(p) {

  const r = Math.round(p * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function boxSt(pids, matches) {
  const s = {}; pids.forEach(id => { s[id] = { id, pts: 0, w: 0, l: 0, rw: 0, rl: 0 }; });
  // Determine per-player game count for this box, derive scaling factor.
  const gpp = gamesPerPlayerForBox(pids, matches.filter(m => m.completed));
  const sf = scaleFactor(gpp);
  matches.filter(m => m.completed).forEach(m => { if (!s[m.player1] || !s[m.player2]) return;
    if (m.forfeit || (m.score1 === 0 && m.score2 === 0)) return;
    s[m.player1].rw += m.score1; s[m.player1].rl += m.score2; s[m.player2].rw += m.score2; s[m.player2].rl += m.score1;
    // Match points scaled by sf. Win counts (w/l) and rack counts (rw/rl) are NOT scaled.
    if (m.score1 > m.score2) { s[m.player1].pts += (m.score2 === 0 ? 5 : 4) * sf; s[m.player1].w++; s[m.player2].pts += (m.score2 > 0 ? 2 : 0) * sf; s[m.player2].l++; }
    else { s[m.player2].pts += (m.score1 === 0 ? 5 : 4) * sf; s[m.player2].w++; s[m.player1].pts += (m.score1 > 0 ? 2 : 0) * sf; s[m.player1].l++; } });
  return Object.values(s).sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    let aW = 0, bW = 0;
    matches.filter(m => m.completed && !m.forfeit && ((m.player1 === a.id && m.player2 === b.id) || (m.player1 === b.id && m.player2 === a.id))).forEach(m => { if ((m.player1 === a.id && m.score1 > m.score2) || (m.player2 === a.id && m.score2 > m.score1)) aW++; else bW++; });

    return b.w - a.w || b.rw - a.rw || (b.rw - b.rl) - (a.rw - a.rl);

}

function calcLad(players, st) {

  const sorted = all.filter(m => m.completed).sort((a, b) => (a.completedAt || "").localeCompare(b.completedAt || ""));

    const a = s[m.player1], b = s[m.player2]; if (!a || !b) return;
    if (m.forfeit || (m.score1 === 0 && m.score2 === 0)) return;
    a.mp++; b.mp++; a.rw += m.score1; a.rl += m.score2; b.rw += m.score2; b.rl += m.score1;
    if (m.completedAt) { if (m.completedAt > a.last) a.last = m.completedAt; if (m.completedAt > b.last) b.last = m.completedAt; }
    const sf = matchScale[m.id] || 1.0;
    const w1 = m.score1 > m.score2; const wp = (w1 ? (m.score2 === 0 ? 5 : 4) : (m.score1 === 0 ? 5 : 4)) * sf; const lp = (w1 ? (m.score2 > 0 ? 2 : 0) : (m.score1 > 0 ? 2 : 0)) * sf;
    if (w1) { a.points += wp; a.boxPts += wp; a.wins++; b.points += lp; b.boxPts += lp; b.losses++; a.streak = a.streak > 0 ? a.streak + 1 : 1; b.streak = 0; }

  });

  // positional, and finishing top of a 6-box is genuinely harder than top of
  // a 4-box, so the bonus should be the same regardless of box size.
  if (st.boxes && st.boxMatches) { st.boxes.forEach((box, bi) => { const bm = st.boxMatches.filter(m => m.box === bi); const realBM = bm.filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0)); if (realBM.length > 0 && bm.every(m => m.completed)) { const bs = boxSt(box.players, realBM); if (bs[0] && s[bs[0].id]) { s[bs[0].id].points += 3; s[bs[0].id].boxPts += 3; } if (bs[1] && s[bs[1].id]) { s[bs[1].id].points += 1; s[bs[1].id].boxPts += 1; } } }); }
  (st.pastCycles || []).forEach(c => { (c.bonuses || []).forEach(b => { if (s[b.id] && b.pts > 0) s[b.id].boxPts += b.pts; }); });

  // A player is INACTIVE (sorted to bottom) if their most recent assigned round
  // ended with 0 real matches played. A "real match" is completed, not forfeited,
  // and has a non-zero score. Forfeits do not count as participation.
  // For each past cycle, count per-player real matches. The MOST RECENT past cycle's
  // result is what determines inactive status (rest just tracked for noPlayedRounds).
  (st.pastCycles || []).forEach((c, idx) => {
    const isLatest = idx === st.pastCycles.length - 1;
    const assignedIds = new Set((c.boxes || []).flatMap(b => b.players));
    const realMatchCounts = {};
    assignedIds.forEach(id => { realMatchCounts[id] = 0; });

      if (!m.completed || m.forfeit || (m.score1 === 0 && m.score2 === 0)) return;

      if (realMatchCounts[m.player2] !== undefined) realMatchCounts[m.player2]++;

  // Player is at risk if they're assigned to the current round's boxes and have

// Build H2H lookup table in a single pass — O(m) instead of O(n^2 * m) when used in sort
function buildH2HMap(st) {

// ELO rating system — score-margin weighted, provisional K, per-match deltas
function calcElo(players, st) {
  const K_BOX = 32, K_PROV = 48, PROV = 8, BASE = 1000;
  const ratings = {}, played = {}, deltas = {};
  players.forEach(p => { ratings[p.id] = BASE; played[p.id] = 0; });
  const all = [];
  (st.pastCycles || []).forEach(c => {
    (c.boxMatches || []).forEach(m => all.push({ ...m, _k: K_BOX }));
  });
  (st.boxMatches || []).forEach(m => all.push({ ...m, _k: K_BOX }));
  all.filter(m => m.completed && !m.forfeit && (m.score1 + m.score2) > 0 && ratings[m.player1] !== undefined && ratings[m.player2] !== undefined)
    .sort((a, b) => (a.completedAt || "").localeCompare(b.completedAt || ""))
    .forEach(m => {
      const ra = ratings[m.player1], rb = ratings[m.player2];
      const tot = m.score1 + m.score2;
      const res1 = m.score1 / tot, res2 = m.score2 / tot;
      const ea = 1 / (1 + Math.pow(10, (rb - ra) / 400));

      const db = Math.round(kb * (res2 - (1 - ea)));
      ratings[m.player1] += da; ratings[m.player2] += db;
      played[m.player1]++; played[m.player2]++;
      deltas[m.id] = { [m.player1]: da, [m.player2]: db };
    });

}

// Get monthly champions from past cycles (Box 1 winner)

function App() {
  const [st, setSt] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [navIdx, setNavIdx] = useState(0);
  const [tappedTab, setTappedTab] = useState(null);
  const [dbError, setDbError] = useState(null);
  const [showQR, setShowQR] = useState(false);
  const [checkInFocus, setCheckInFocus] = useState(false);
  const touchStartY = React.useRef(0);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(null), 2800); };

  // ─── DATABASE SAFETY (Batch F hardening) ────────────────────────────────
  // CRITICAL: The previous version of this snapshot handler wrote DEF (empty state)
  // back to the database whenever `doc.exists` was false. That single line caused the
  // production wipe-out: a transient Firestore reconnect, an offline blip, or any
  // moment where the snapshot fired with exists=false would IMMEDIATELY overwrite
  // the entire league with empty state. Multiple concurrent clients made it worse —
  // each one racing to "initialize" the doc would clobber the others.
  //
  // New behavior:
  //   - Snapshot ONLY reads. It never writes. Period.
  //   - First-time bootstrap is a one-shot, guarded transaction that runs ONCE at
  //     app start. It uses tx.get() to verify the doc truly doesn't exist before
  //     creating it — and only the first client to reach that point wins.
  //   - If the snapshot ever fires with exists=false AFTER we already have state,
  //     we treat it as a transient error and keep the last-known-good local state.
  //     We do NOT overwrite the server.
  const bootedRef = React.useRef(false);
  useEffect(() => {
    let cancelled = false;

    // One-shot bootstrap: only create the doc if it has truly never existed.
    // Runs exactly once, in a transaction, so racing clients can't double-init.
    const bootstrap = async () => {
      if (bootedRef.current || cancelled) return;
      bootedRef.current = true;
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(DOC_REF);
          if (!snap.exists) {
            tx.set(DOC_REF, { ...DEF, _createdAt: nw(), _schemaVersion: 1 });
          }
        });
      } catch (e) {
        console.error("Bootstrap failed (will retry on next snapshot):", e);
        bootedRef.current = false; // allow retry
      }
    };

    const unsub = DOC_REF.onSnapshot(
      (doc) => {
        if (cancelled) return;
        setDbError(null);
        if (doc.exists) {
          // Happy path: server has data, apply it locally.
          setSt(doc.data());
        } else {
          // Doc doesn't exist. Two cases:
          //   1. First-ever load (no league yet) — bootstrap will create it.
          //   2. Something deleted the doc (admin reset, manual console intervention).
          // In BOTH cases, do NOT write DEF from the snapshot handler. Let the
          // transactional bootstrap handle creation. If we already have local state,
          // keep showing it — the snapshot will re-fire once bootstrap commits.
          bootstrap();
        }
      },
      (error) => {
        if (cancelled) return;
        console.error("Firestore snapshot error:", error);
        setDbError(error.message);
        // CRITICAL: never overwrite local state with DEF on snapshot error.
        // Keep the last-known-good state visible to the user.
        setSt(prev => prev || null);
      }
    );

    return () => { cancelled = true; unsub(); };
  }, []);

  // ─── save() — transactional, with state-collapse guard ────────────────────
  // Every write goes through a Firestore transaction, so concurrent writers can't
  // clobber each other. The mutator receives the SERVER's current state (not our
  // possibly-stale local snapshot) and returns the new state.
  //
  // State-collapse guard: if a mutator would shrink the league dramatically (lose
  // all players, lose all past cycles, lose the bracket once it exists), we ABORT
  // the transaction unless the mutator explicitly opted in via the `allowCollapse`
  // flag. This is a server-side seatbelt that catches bugs in mutators AND prevents
  // any malicious or buggy write from wiping the database.
  //
  // If a write fails, we do NOT roll back local state — onSnapshot will resync
  // from the server on its own.
  const save = useCallback(async (mutator, errMsg, opts = {}) => {
    const { allowCollapse = false } = opts;
    const fn = typeof mutator === "function" ? mutator : () => mutator;
    try {
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(DOC_REF);
        if (!snap.exists) {
          // Doc was deleted between snapshot and now. Bootstrap it with DEF
          // INSIDE this transaction (atomic), then let the caller's mutator
          // build from there. This is the only path that can ever write DEF.
          tx.set(DOC_REF, { ...DEF, _createdAt: nw(), _schemaVersion: 1 });
          // We bail out of this particular write; the snapshot listener will
          // pick up the new empty state and the user can re-issue their action.
          return;
        }
        const current = snap.data();
        const next = fn(current);
        if (!next) return; // mutator opted out

        // ── State-collapse guard ──
        if (!allowCollapse) {
          const hadPlayers = (current.players || []).length;
          const willHavePlayers = (next.players || []).length;
          const hadCycles = (current.pastCycles || []).length;
          const willHaveCycles = (next.pastCycles || []).length;
          const hadBracket = !!current.bracket;
          const willHaveBracket = !!next.bracket;

          // Reject: losing >50% of players in a single write
          if (hadPlayers >= 3 && willHavePlayers < Math.ceil(hadPlayers / 2)) {
            throw new Error(`Refused: write would drop players from ${hadPlayers} to ${willHavePlayers}. Use opts.allowCollapse to override.`);
          }
          // Reject: silently losing past cycles
          if (hadCycles > willHaveCycles + 1) {
            throw new Error(`Refused: write would drop past cycles from ${hadCycles} to ${willHaveCycles}.`);
          }
          // Reject: losing a built bracket
          if (hadBracket && !willHaveBracket) {
            throw new Error(`Refused: write would clear the bracket.`);
          }
        }

        // ── Size guard ──
        // Firestore caps documents at 1 MiB. We refuse to write within 100 KiB of
        // that ceiling so the league never gets into an unrecoverable state where
        // every subsequent write fails.
        const sizeBytes = new Blob([JSON.stringify(next)]).size;
        if (sizeBytes > 900 * 1024) {
          throw new Error(`Refused: document would be ${(sizeBytes/1024).toFixed(0)} KiB (limit 900 KiB). Archive or trim auditLog.`);
        }

        tx.set(DOC_REF, next);
      });
    } catch (e) {
      console.error("Save failed:", e);
      // Show the actual error message to help diagnose — the generic fallback
      // hid the real reason. Strip the "Refused: " prefix that comes from our
      // own guards for a cleaner toast.
      const msg = (e && e.message) ? String(e.message).replace(/^Refused:\s*/, "") : "";
      flash(errMsg ? (errMsg + (msg ? " — " + msg : "")) : (msg || "Save failed — your change wasn't applied."));
    }
  }, []);
  const forceRefresh = useCallback(() => { setRefreshing(true); DOC_REF.get().then(doc => { if (doc.exists) setSt(doc.data()); }).catch(() => {}).finally(() => setRefreshing(false)); }, []);

  // ─── Backups ──────────────────────────────────────────────────────────────
  // Write the current league state to league/state/backups/{timestamp}. Cheap
  // (~one extra write) and provides full point-in-time recovery. Called manually
  // by the admin and automatically at every round transition.
  const backupNow = useCallback(async (reason = "manual") => {
    try {
      const snap = await DOC_REF.get();
      if (!snap.exists) { flash("Nothing to back up"); return false; }
      const data = snap.data();
      // Human-readable ID that sorts chronologically: backup-2026-06-05_16-11-35-360Z
      // (Firestore doc IDs can't contain / or . but : would also be hard to read,
      // so we replace both colons and dots with dashes.)
      const ts = new Date().toISOString().replace(/[:.]/g, "-").replace("T", "_");
      const slug = reason.toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
      const id = "backup-" + ts + (slug && slug !== "manual" ? "__" + slug : "");
      await DOC_REF.collection("backups").doc(id).set({
        ...data, _backupReason: reason, _backupAt: nw(), _backupId: id
      });
      if (reason === "manual") flash("Backup saved");
      return true;
    } catch (e) {
      console.error("Backup failed:", e);
      flash("Backup failed — check console");
      return false;
    }
  }, []);

  // Fire-and-forget auto-backup on important state transitions. We don't await
  // because the transition itself should never be blocked by backup latency.
  const autoBackup = useCallback((reason) => { backupNow(reason).catch(() => {}); }, [backupNow]);
  const onTouchStart = (e) => { touchStartY.current = e.touches[0].clientY; };
  const onTouchEnd = (e) => { if (e.changedTouches[0].clientY - touchStartY.current > 70 && window.scrollY === 0) forceRefresh(); };
  const cd = useCD(st?.cycleStart, st?.cycleDurationWeeks);
  const ladder = useMemo(() => st ? calcLad(st.players, st) : [], [st]);
  const activeIds = st ? new Set([
    // Players in the currently active round's boxes
    ...(st.boxes || []).flatMap(b => b.players),
    // Players who completed matches in the current round
    ...(st.boxMatches || []).filter(m => m.completed).flatMap(m => [m.player1, m.player2]),
    // Players seeded into the bracket (covers the bracket phase, where the
    // current round's boxes/matches are empty but the standings should still
    // show every player who made it into the tournament)
    ...((st.bracket && st.bracket.seeds) || []).map(s => s.id).filter(Boolean),
  ]) : new Set();
  const activeLad = ladder.filter(s => activeIds.has(s.id));
  const gn = (id) => { if (!st) return "?"; const p = st.players.find(x => x.id === id); return p ? p.name : "?"; };
  const ini = (id) => gn(id).split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 3);
  if (!st) return <div style={{ background: P.navy, minHeight: "100vh", padding: "60px 14px" }}>
    <style>{"@keyframes spin{to{transform:rotate(360deg)}} @keyframes shimmerLoad{0%{background-position:200% center}100%{background-position:-200% center}}"}</style>
    <div style={{ maxWidth: 600, margin: "0 auto" }}>
      <div style={{ ...gc, height: 80, background: "linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 75%)", backgroundSize: "200% 100%", animation: "shimmerLoad 1.5s infinite" }} />
      {[1,2,3,4,5].map(i => <div key={i} style={{ ...gc, height: 44, marginBottom: 6, background: "linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 75%)", backgroundSize: "200% 100%", animation: "shimmerLoad 1.5s infinite", animationDelay: i * 0.1 + "s" }} />)}
      <div style={{ textAlign: "center", marginTop: 20 }}><div style={{ width: 24, height: 24, border: "2px solid " + P.mid, borderTop: "2px solid " + P.orange, borderRadius: "50%", animation: "spin .7s linear infinite", display: "inline-block" }} /></div>
    </div>
  </div>;

  const addP = (n) => {
    const name = n.trim(); if (!name) { flash("Invalid name"); return; }
    save(cur => {
      if ((cur.players || []).find(p => p.name.toLowerCase() === name.toLowerCase())) { flash("Duplicate name"); return null; }
      const np = { id: uid(), name, joinedAt: nw() };
      // Admin-added players skip pending. Remove from available + pending in case the name was there.
      const avail = (cur.availablePlayers || []).filter(n => n !== name);
      const pending = (cur.pendingPlayers || []).filter(p => p.name !== name);
      return withLog({ ...cur, players: [...(cur.players || []), np], availablePlayers: avail, pendingPlayers: pending }, "PLAYER_ADDED", name);
    }, "Couldn't add player");
    flash(name + " added!");
  };
  const rmP = (id) => {
    save(cur => {
      const nm = (cur.players.find(p => p.id === id) || {}).name || id;
      const ff = arr => (arr || []).map(m => (m.player1 === id || m.player2 === id) && !m.completed ? { ...m, score1: 0, score2: 0, completed: true, completedAt: nw(), forfeit: true } : m);
      // Per spec: removed players DO NOT return to available — they disappear entirely.
      return withLog({ ...cur, players: cur.players.filter(p => p.id !== id), checkedIn: (cur.checkedIn || []).filter(c => c !== id), boxMatches: ff(cur.boxMatches) }, "PLAYER_REMOVED", nm);
    }, "Couldn't remove player");
    flash("Removed");
  };
  // User picks their name from the available list → goes to pending approval.
  // One pending entry per name (re-tapping does nothing).
  const requestJoin = (name) => {
    save(cur => {
      const avail = cur.availablePlayers || [];
      const pending = cur.pendingPlayers || [];
      if (!avail.includes(name)) { flash("Not available"); return null; }
      if (pending.some(p => p.name === name)) { flash("Already pending approval"); return null; }
      if ((cur.players || []).some(p => p.name === name)) { flash("Already active"); return null; }
      flash(name + " — submitted! Waiting for admin approval.");
      return withLog({ ...cur, pendingPlayers: [...pending, { name, requestedAt: nw() }] }, "JOIN_REQUESTED", name);
    }, "Couldn't submit");
  };
  // Admin approves a pending player → moves to active, removed from available,
  // AND auto-checks them in for the next round.
  const approvePlayer = (name) => {
    save(cur => {
      const pending = (cur.pendingPlayers || []).filter(p => p.name !== name);
      const avail = (cur.availablePlayers || []).filter(n => n !== name);
      if ((cur.players || []).some(p => p.name === name)) { flash("Already active"); return null; }
      const np = { id: uid(), name, joinedAt: nw() };
      const checkedIn = [...new Set([...(cur.checkedIn || []), np.id])];
      flash(name + " approved & signed up for next round!");
      return withLog({ ...cur, players: [...(cur.players || []), np], pendingPlayers: pending, availablePlayers: avail, checkedIn }, "PLAYER_APPROVED", name);
    }, "Couldn't approve");
  };
  // Admin rejects → name goes back to available (so they can try again later).
  const rejectPlayer = (name) => {
    save(cur => {
      const pending = (cur.pendingPlayers || []).filter(p => p.name !== name);
      const avail = (cur.availablePlayers || []);
      const newAvail = avail.includes(name) ? avail : [...avail, name];
      flash(name + " rejected");
      return withLog({ ...cur, pendingPlayers: pending, availablePlayers: newAvail }, "PLAYER_REJECTED", name);
    }, "Couldn't reject");
  };
  const togCI = (id) => {
    save(cur => {
      if (!(cur.players || []).some(p => p.id === id)) return null;
      const checked = (cur.checkedIn || []).includes(id);
      return withLog({ ...cur, checkedIn: checked ? cur.checkedIn.filter(c => c !== id) : [...(cur.checkedIn || []), id] }, "CHECKIN_TOGGLED", gn(id));
    }, "Couldn't update sign-up");
  };
  const selLast = () => {
    save(cur => {
      if (!(cur.pastCycles || []).length) { flash("No previous round"); return null; }
      const lastC = cur.pastCycles[cur.pastCycles.length - 1];
      const allM = (lastC.boxMatches || []).filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0));
      const ids = [...new Set(allM.flatMap(m => [m.player1, m.player2]))].filter(id => (cur.players || []).some(p => p.id === id));
      if (!ids.length) { flash("No previous round"); return null; }
      flash(ids.length + " from last round!");
      return withLog({ ...cur, checkedIn: ids }, "CHECKIN_AUTO_SELECT", ids.length + " players");
    }, "Couldn't auto-select");
  };
  const completeCyc = () => {
    autoBackup("pre-round-complete-" + (st?.cycleNumber || 0));
    save(cur => {
      const bon = [];
      if (cur.boxes) cur.boxes.forEach((box, bi) => { const bm = (cur.boxMatches || []).filter(m => m.box === bi); const realBM = bm.filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0)); if (realBM.length > 0 && bm.every(m => m.completed)) { const bs = boxSt(box.players, realBM); if (bs[0]) bon.push({ id: bs[0].id, pts: 3 }); if (bs[1]) bon.push({ id: bs[1].id, pts: 1 }); } });
      const past = cur.cycleNumber > 0 ? [...(cur.pastCycles || []), { cycle: cur.cycleNumber, boxMatches: cur.boxMatches || [], boxes: cur.boxes || [], bonuses: [...bon], startedAt: cur.cycleStart, randomized: cur.cycleRandomized || false }] : cur.pastCycles;
      // Default everyone IN for next round — they can leave if they don't want to play.
      const allActiveIds = (cur.players || []).map(p => p.id);
      flash("Round " + cur.cycleNumber + " complete!");
      return withLog({ ...cur, pastCycles: past, boxes: [], boxMatches: [], checkedIn: allActiveIds }, "CYCLE_COMPLETED", "Round " + cur.cycleNumber);
    }, "Couldn't complete round");
  };
  const endEarlyCyc = () => {
    autoBackup("pre-round-end-early-" + (st?.cycleNumber || 0));
    save(cur => {
      const bon = [];
      const afBM = (cur.boxMatches || []).map(m => !m.completed ? { ...m, score1: 0, score2: 0, completed: true, completedAt: nw(), forfeit: true, autoForfeit: true } : m);
      if (cur.boxes) cur.boxes.forEach((box, bi) => { const bm = afBM.filter(m => m.box === bi); const realBM = bm.filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0)); if (realBM.length > 0) { const bs = boxSt(box.players, realBM); if (bs[0]) bon.push({ id: bs[0].id, pts: 3 }); if (bs[1]) bon.push({ id: bs[1].id, pts: 1 }); } });
      const past = [...(cur.pastCycles || []), { cycle: cur.cycleNumber, boxMatches: afBM, boxes: cur.boxes || [], bonuses: [...bon], startedAt: cur.cycleStart, randomized: cur.cycleRandomized || false }];
      // Default everyone IN for next round — they can leave if they don't want to play.
      const allActiveIds = (cur.players || []).map(p => p.id);
      flash("Round " + cur.cycleNumber + " ended.");
      return withLog({ ...cur, pastCycles: past, boxes: [], boxMatches: [], checkedIn: allActiveIds }, "CYCLE_ENDED_EARLY", "Round " + cur.cycleNumber);
    }, "Couldn't end round");
  };
  // Build the archive object for the current round (dry-run, no save)
  const buildArchive = () => {
    if (st.cycleNumber > 0 && (st.boxes || []).length > 0) {
      const bon = [];
      const afBM = (st.boxMatches || []).map(m => !m.completed ? { ...m, score1: 0, score2: 0, completed: true, completedAt: nw(), forfeit: true, autoForfeit: true } : m);
      if (st.boxes) st.boxes.forEach((box, bi) => { const bm = afBM.filter(m => m.box === bi); const realBM = bm.filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0)); if (realBM.length > 0) { const bs = boxSt(box.players, realBM); if (bs[0]) bon.push({ id: bs[0].id, pts: 3 }); if (bs[1]) bon.push({ id: bs[1].id, pts: 1 }); } });
      return [...st.pastCycles, { cycle: st.cycleNumber, boxMatches: afBM, boxes: st.boxes || [], bonuses: [...bon], startedAt: st.cycleStart, randomized: st.cycleRandomized || false }];
    }
    return st.pastCycles;
  };
  // Compute seeded boxes for admin preview — does NOT write to Firestore
  // Generate suggested boxes via random shuffle. Admin sees this as a preview
  // and can drag players around to adjust before confirming. The `randomize`
  // argument is preserved for back-compat with existing callers but no longer
  // affects behavior — every round is randomized.
  const previewCyc = (randomize = true) => {
    if (st.checkedIn.length < 4) { flash("Need 4+"); return null; }
    if (st.cycleNumber > 0 && (st.boxes || []).length > 0) { flash("Round already in progress"); return null; }
    const past = buildArchive();
    const nl = calcLad(st.players, { ...st, pastCycles: past, boxMatches: [], boxes: [] });
    // Compute ELO for display in admin preview (not used for placement)
    const eloResult = calcElo(st.players, { ...st, pastCycles: past, boxMatches: [] });
    // Build per-player reason badges: new vs returning (based on any past box match)
    const playerReasons = {};
    st.checkedIn.forEach(pid => {
      const everPlayed = past.some(c => (c.boxMatches || []).some(m => m.player1 === pid || m.player2 === pid));
      playerReasons[pid] = { reason: everPlayed ? "returning" : "new", fromBox: null, lastRecord: null };
    });
    return {
      randomize: true,
      suggestedBoxes: buildBoxes(st.checkedIn, nl, true),
      playerReasons,
      eloRatings: eloResult.ratings,
      eloPlayed: eloResult.played,
      eloFrac: {},
    };
  };
  // Confirm: save admin-approved (possibly adjusted) boxes to Firestore
  const confirmCyc = (finalBoxes, randomize, movedIds) => {
    save(cur => {
      const past = buildArchive();
      const stampedBoxes = finalBoxes.map(box => ({ ...box, manuallyPlaced: box.players.filter(id => movedIds.has(id)) }));
      const bm = genBM(stampedBoxes);
      const ns = { ...cur, pastCycles: past, boxes: stampedBoxes, boxMatches: bm, checkedIn: [], cycleStart: nw(), cycleNumber: (cur.cycleNumber || 0) + 1, cycleRandomized: randomize };
      flash("Round " + ((cur.cycleNumber || 0) + 1) + " started!");
      return withLog(ns, "CYCLE_STARTED", "Round " + ((cur.cycleNumber || 0) + 1));
    }, "Couldn't start round");
  };
  const undoCyc = () => {
    save(cur => {
      if ((cur.cycleNumber || 0) < 1) return null;
      const prev = (cur.pastCycles || [])[(cur.pastCycles || []).length - 1];
      const restore = arr => (arr || []).map(m => m.autoForfeit ? { ...m, score1: null, score2: null, completed: false, completedAt: null, forfeit: false, autoForfeit: false } : m);
      const base = prev
        ? { ...cur, pastCycles: cur.pastCycles.slice(0, -1), boxes: prev.boxes || [], boxMatches: restore(prev.boxMatches), checkedIn: [], cycleStart: prev.startedAt, cycleNumber: cur.cycleNumber - 1 }
        : { ...cur, boxes: [], boxMatches: [], checkedIn: [], cycleStart: null, cycleNumber: 0 };
      flash("Undone!");
      return withLog(base, "CYCLE_UNDONE", "Round " + cur.cycleNumber);
    }, "Couldn't undo round");
  };
  const logR = (id, s1, s2, list) => {
    if (typeof s1 !== "number" || typeof s2 !== "number" || s1 < 0 || s2 < 0 || s1 > 2 || s2 > 2 || (s1 !== 2 && s2 !== 2) || s1 === s2) { flash("Invalid score"); return; }
    save(cur => {
      const m = (cur[list] || []).find(x => x.id === id);
      if (!m) { flash("Match not found"); return null; }
      const p1Name = (cur.players.find(p => p.id === m.player1) || {}).name || "?";
      const p2Name = (cur.players.find(p => p.id === m.player2) || {}).name || "?";
      const det = p1Name + " " + s1 + "-" + s2 + " " + p2Name;
      const playerIds = new Set((cur.players || []).map(p => p.id));
      const newCI = [...new Set([...(cur.checkedIn || []), m.player1, m.player2])].filter(pid => playerIds.has(pid));
      flash(p1Name + " " + s1 + "–" + s2 + " " + p2Name);
      return withLog({ ...cur, [list]: cur[list].map(x => x.id === id ? { ...x, score1: s1, score2: s2, completed: true, completedAt: nw(), forfeit: false } : x), checkedIn: newCI }, "MATCH_RECORDED", det);
    }, "Couldn't save score — try again");
  };
  const ffM = (id, list) => {
    save(cur => {
      const m = (cur[list] || []).find(x => x.id === id);
      if (!m) return null;
      const p1Name = (cur.players.find(p => p.id === m.player1) || {}).name || "?";
      const p2Name = (cur.players.find(p => p.id === m.player2) || {}).name || "?";
      flash(p1Name + " vs " + p2Name + " — not played");
      return withLog({ ...cur, [list]: cur[list].map(x => x.id === id ? { ...x, score1: 0, score2: 0, completed: true, completedAt: nw(), forfeit: true } : x) }, "MATCH_FORFEIT", p1Name + " vs " + p2Name);
    }, "Couldn't mark forfeit");
  };
  // resetAll: the only legitimate state-collapse path. Snapshots a backup
  // FIRST so that even an intentional reset is recoverable, then explicitly
  // opts into the collapse guard with allowCollapse=true.
  const resetAll = async () => {
    try {
      // Take an emergency backup before nuking, in case this was a misclick.
      const snap = await DOC_REF.get();
      if (snap.exists) {
        const data = snap.data();
        if ((data.players || []).length > 0 || (data.pastCycles || []).length > 0) {
          const ts = new Date().toISOString().replace(/[:.]/g, "-").replace("T", "_");
          const id = "backup-" + ts + "__pre-reset";
          await db.collection("league").doc("state").collection("backups")
            .doc(id).set({ ...data, _backupReason: "manual reset", _backupAt: nw(), _backupId: id });
        }
      }
    } catch (e) { console.error("Pre-reset backup failed (continuing):", e); }
    save(() => DEF, "Couldn't reset", { allowCollapse: true });
    flash("Reset!"); setView("home");
  };

  // ─── BRACKET HANDLERS ──────────────────────────────────────────────────
  // Build a single-elimination bracket from cumulative seeding standings.
  // All checked-in/active players are seeded by cumulative points (ELO breaks ties).
  // Bracket size rounds up to the next power of 2; top seeds get byes through Round 1.
  const endSeedingPhase = () => {
    autoBackup("pre-bracket-creation");
    save(cur => {
      if (cur.seedingPhaseEnded) { flash("Seeding already ended"); return null; }
      // Archive any in-progress round first
      let working = cur;
      if ((cur.cycleNumber || 0) > 0 && (cur.boxes || []).length > 0) {
        const bon = [];
        const afBM = (cur.boxMatches || []).map(m => !m.completed ? { ...m, score1: 0, score2: 0, completed: true, completedAt: nw(), forfeit: true, autoForfeit: true } : m);
        if (cur.boxes) cur.boxes.forEach((box, bi) => { const bm = afBM.filter(m => m.box === bi); const realBM = bm.filter(m => m.completed && !m.forfeit && !(m.score1 === 0 && m.score2 === 0)); if (realBM.length > 0) { const bs = boxSt(box.players, realBM); if (bs[0]) bon.push({ id: bs[0].id, pts: 3 }); if (bs[1]) bon.push({ id: bs[1].id, pts: 1 }); } });
        const past = [...(cur.pastCycles || []), { cycle: cur.cycleNumber, boxMatches: afBM, boxes: cur.boxes || [], bonuses: [...bon], startedAt: cur.cycleStart, randomized: cur.cycleRandomized || false }];
        working = { ...cur, pastCycles: past, boxes: [], boxMatches: [] };
      }
      // Compute final standings using all archived cycles
      const finalLad = calcLad(working.players, working);
      const eloResult = calcElo(working.players, working);
      // Eligible bracket participants = active players who played at least 1 real match
      const eligible = finalLad.filter(s => (s.mp || 0) > 0 && !s.inactive);
      if (eligible.length < 2) { flash("Need at least 2 active players for bracket"); return null; }
      // Sort by points desc, ELO desc as tiebreaker
      const sorted = [...eligible].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return (eloResult.ratings[b.id] || 1000) - (eloResult.ratings[a.id] || 1000);
      });
      // Round up to next power of 2 for byes
      const n = sorted.length;
      const bracketSize = Math.pow(2, Math.ceil(Math.log2(n)));
      // Build slot objects with a consistent shape — every field defined, no
      // undefined values (Firestore rejects undefined). Real seeds get bye=false.
      const seeds = sorted.map((p, i) => ({
        id: p.id,
        seed: i + 1,
        points: p.points == null ? 0 : p.points,
        elo: eloResult.ratings[p.id] || 1000,
        bye: false,
      }));
      // Pad with BYE slots so total = bracketSize
      const slots = [...seeds];
      while (slots.length < bracketSize) slots.push({ id: null, seed: slots.length + 1, points: 0, elo: 0, bye: true });
      // ─── CHAMPIONSHIP-STYLE SEED POSITIONING ───
      // Build the canonical seed-position order so that the highest seeds can
      // only meet in the latest rounds. #1 and #2 are on opposite halves
      // (can only meet in the Final), #1-#4 are in different quarters
      // (can only meet in Semifinal or Final), and so on.
      //
      // Algorithm: starting with [1, 2], for each doubling, every existing
      // seed s at position i becomes the pair (s, size+1-s) so that strong
      // seeds anchor each new half. This produces the standard bracket
      // ordering used in NCAA, ATP, and most pro tournaments.
      function buildSeedOrder(size) {
        let order = [1, 2];
        while (order.length < size) {
          const newSize = order.length * 2;
          const next = [];
          for (const s of order) {
            next.push(s);
            next.push(newSize + 1 - s);
          }
          order = next;
        }
        return order; // e.g. for size 8: [1, 8, 5, 4, 3, 6, 7, 2]
      }
      const seedOrder = buildSeedOrder(bracketSize);
      // Map seed number → slot object (so seed 1 = slots[0], seed 2 = slots[1], etc.)
      const positioned = seedOrder.map(seedNum => slots[seedNum - 1]);
      // Build Round 1 matches: pair adjacent positions (0,1), (2,3), ...
      const r1Pairs = [];
      const half = bracketSize / 2;
      for (let i = 0; i < half; i++) {
        const top = positioned[i * 2];
        const bot = positioned[i * 2 + 1];
        r1Pairs.push({ top, bot });
      }
      // Construct rounds. Round 1 plays; subsequent rounds wait.
      const numRounds = Math.log2(bracketSize);
      const rounds = [];
      // Round 1 — auto-advance byes
      const r1Matches = r1Pairs.map((pair, idx) => {
        // Coerce to boolean — non-bye slots have undefined `bye`, and Firestore
        // rejects undefined field values with "Unsupported field value: undefined".
        const isBye = !!(pair.top.bye || pair.bot.bye);
        let winner = null, completed = false;
        if (isBye) {
          winner = pair.top.bye ? pair.bot.id : pair.top.id;
          completed = true;
        }
        return {
          id: uid(),
          round: 1,
          matchIdx: idx,
          p1: pair.top.id == null ? null : pair.top.id,
          p1Seed: pair.top.seed == null ? null : pair.top.seed,
          p2: pair.bot.id == null ? null : pair.bot.id,
          p2Seed: pair.bot.seed == null ? null : pair.bot.seed,
          score1: null,
          score2: null,
          winner: winner == null ? null : winner,
          completed: !!completed,
          completedAt: completed ? nw() : null,
          isBye,
        };
      });
      rounds.push({ round: 1, matches: r1Matches });
      // Subsequent rounds — empty shells
      for (let r = 2; r <= numRounds; r++) {
        const matchesInRound = bracketSize / Math.pow(2, r);
        const shellMatches = [];
        for (let i = 0; i < matchesInRound; i++) {
          shellMatches.push({
            id: uid(),
            round: r,
            matchIdx: i,
            p1: null,
            p1Seed: null,
            p2: null,
            p2Seed: null,
            score1: null,
            score2: null,
            winner: null,
            completed: false,
            completedAt: null,
            isBye: false,
          });
        }
        rounds.push({ round: r, matches: shellMatches });
      }
      // Auto-fill Round 2 from any byes in Round 1
      const r1 = rounds[0];
      const r2 = rounds[1];
      if (r2) {
        r1.matches.forEach((m, i) => {
          if (m.completed && m.winner) {
            const r2Match = r2.matches[Math.floor(i / 2)];
            // Look up the winning seed: winner is either the top or bottom of the R1 pair
            const winSeed = m.winner === r1Pairs[i].top.id ? r1Pairs[i].top.seed : r1Pairs[i].bot.seed;
            if (i % 2 === 0) { r2Match.p1 = m.winner; r2Match.p1Seed = winSeed; }
            else { r2Match.p2 = m.winner; r2Match.p2Seed = winSeed; }
          }
        });
      }
      const bracket = { size: bracketSize, numRounds, seeds, rounds, createdAt: nw() };
      flash("Seeding phase ended — bracket unlocked!");
      return withLog({ ...working, seedingPhaseEnded: true, bracket, checkedIn: [] }, "SEEDING_ENDED", `Bracket created with ${sorted.length} players (size ${bracketSize})`);
    }, "Couldn't end seeding phase");
  };

  // Record a bracket match result. Best-of-5, simple win/loss (no points awarded).
  const recordBracketMatch = (matchId, winnerId, score1, score2) => {
    save(cur => {
      if (!cur.bracket) { flash("No bracket"); return null; }
      const bracket = JSON.parse(JSON.stringify(cur.bracket));
      let foundMatch = null, foundRoundIdx = -1, foundMatchIdx = -1;
      bracket.rounds.forEach((r, ri) => { r.matches.forEach((m, mi) => { if (m.id === matchId) { foundMatch = m; foundRoundIdx = ri; foundMatchIdx = mi; } }); });
      if (!foundMatch) { flash("Match not found"); return null; }
      if (foundMatch.isBye) { flash("Cannot record bye"); return null; }
      if (!foundMatch.p1 || !foundMatch.p2) { flash("Match not ready"); return null; }
      if (winnerId !== foundMatch.p1 && winnerId !== foundMatch.p2) { flash("Invalid winner"); return null; }
      foundMatch.winner = winnerId;
      foundMatch.score1 = score1;
      foundMatch.score2 = score2;
      foundMatch.completed = true;
      foundMatch.completedAt = nw();
      // Propagate winner to next round
      const nextRound = bracket.rounds[foundRoundIdx + 1];
      if (nextRound) {
        const nextMatch = nextRound.matches[Math.floor(foundMatchIdx / 2)];
        const winSeed = winnerId === foundMatch.p1 ? foundMatch.p1Seed : foundMatch.p2Seed;
        if (foundMatchIdx % 2 === 0) { nextMatch.p1 = winnerId; nextMatch.p1Seed = winSeed; }
        else { nextMatch.p2 = winnerId; nextMatch.p2Seed = winSeed; }
      }
      // If this was the final, crown a champion
      let champion = cur.champion;
      const isFinal = foundRoundIdx === bracket.rounds.length - 1;
      if (isFinal) {
        const champName = (cur.players.find(p => p.id === winnerId) || {}).name || "?";
        champion = { id: winnerId, name: champName, crownedAt: nw(), season: "Summer 2026" };
        flash("🏆 " + champName + " — Champion!");
      } else {
        const wName = (cur.players.find(p => p.id === winnerId) || {}).name || "?";
        flash(wName + " advances!");
      }
      return withLog({ ...cur, bracket, champion }, "BRACKET_MATCH", `R${foundMatch.round} winner: ${(cur.players.find(p => p.id === winnerId) || {}).name || "?"}`);
    }, "Couldn't record bracket match");
  };

  // Undo bracket: clears bracket and re-opens seeding phase (mirrors undoCyc).
  // If a match was just recorded, undoes only that latest match instead.
  const undoBracket = () => {
    save(cur => {
      if (!cur.bracket) { flash("No bracket to undo"); return null; }
      // Find the most recently completed (non-bye) match
      let latestMatch = null, latestRoundIdx = -1, latestMatchIdx = -1;
      cur.bracket.rounds.forEach((r, ri) => {
        r.matches.forEach((m, mi) => {
          if (m.completed && !m.isBye && m.completedAt) {
            if (!latestMatch || m.completedAt > latestMatch.completedAt) {
              latestMatch = m; latestRoundIdx = ri; latestMatchIdx = mi;
            }
          }
        });
      });
      if (!latestMatch) {
        // No matches played yet — undo the entire bracket creation
        flash("Bracket cleared, seeding re-opened");
        return withLog({ ...cur, seedingPhaseEnded: false, bracket: null, champion: null }, "BRACKET_UNDONE", "Full bracket cleared");
      }
      // Undo the latest match
      const bracket = JSON.parse(JSON.stringify(cur.bracket));
      const m = bracket.rounds[latestRoundIdx].matches[latestMatchIdx];
      const undoneWinner = m.winner;
      m.winner = null; m.score1 = null; m.score2 = null; m.completed = false; m.completedAt = null;
      // Clear the slot in the next round where this winner was placed
      const nextRound = bracket.rounds[latestRoundIdx + 1];
      if (nextRound) {
        const nm = nextRound.matches[Math.floor(latestMatchIdx / 2)];
        if (latestMatchIdx % 2 === 0) { nm.p1 = null; nm.p1Seed = null; }
        else { nm.p2 = null; nm.p2Seed = null; }
        // If next-round match had been completed, that's a cascade we don't auto-handle; warn admin
        if (nm.completed) flash("Note: subsequent match was already played — review bracket");
      }
      // If we just undid the final, also clear the champion
      const isFinal = latestRoundIdx === bracket.rounds.length - 1;
      const champion = isFinal ? null : cur.champion;
      flash("Bracket match undone");
      return withLog({ ...cur, bracket, champion }, "BRACKET_MATCH_UNDONE", `R${m.round} undid: ${(cur.players.find(p => p.id === undoneWinner) || {}).name || "?"}`);
    }, "Couldn't undo bracket");
  };

  const tabs = SPECTATOR
    ? [["home", "\ud83c\udfc6"], ["boxes", "\ud83d\udcca"], ["matches", "\ud83c\udfb1"], ["bracket", "\ud83c\udfc5"], ["rules", "\ud83d\udcd6"]]
    : [["home", "\ud83c\udfc6"], ["boxes", "\ud83d\udcca"], ["matches", "\ud83c\udfb1"], ["bracket", "\ud83c\udfc5"], ["checkin", "\u2705"], ["rules", "\ud83d\udcd6"]];

  return (
    <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{ minHeight: "100vh", background: P.navy, color: P.off, fontFamily: "'DM Sans',Helvetica,sans-serif" }}>
      <style>{`
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        @keyframes slideT{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,25px)}}
        @keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(25px,-20px)}}
        @keyframes orbFloat3{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,30px)}}
        @keyframes navBounce{0%{transform:scale(1) translateY(0)}30%{transform:scale(1.35) translateY(-5px)}60%{transform:scale(.95) translateY(1px)}100%{transform:scale(1) translateY(0)}}
        @keyframes glowBurst{0%{opacity:.7;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
        @keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
        button:active{transform:scale(.97)}
        input:focus,select:focus{outline:none!important;border-color:rgba(21,152,203,.7)!important;box-shadow:0 0 0 3px rgba(21,152,203,.2)!important}
        select option{background:${P.navy};color:${P.off}}
      `}</style>
      {toast && <div style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 100, background: "linear-gradient(135deg," + P.orange + "," + P.amber + ")", color: P.navy, padding: "9px 22px", borderRadius: 12, fontSize: 12, fontWeight: 700, animation: "slideT .25s ease-out", whiteSpace: "nowrap" }}>{toast}</div>}
      {dbError && <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 98, background: "rgba(248,113,113,.15)", borderBottom: "1px solid rgba(248,113,113,.3)", padding: "6px 16px", fontSize: 11, color: P.bad, textAlign: "center" }}>⚠️ Firebase: {dbError} — <span onClick={() => window.location.reload()} style={{ textDecoration: "underline", cursor: "pointer" }}>retry</span></div>}
      {refreshing && <div style={{ position: "fixed", top: 0, left: "50%", transform: "translateX(-50%)", zIndex: 99, background: "rgba(255,255,255,.08)", backdropFilter: "blur(20px)", borderRadius: "0 0 12px 12px", padding: "6px 18px", fontSize: 11, color: P.blue, fontWeight: 700, border: "1px solid rgba(255,255,255,.15)", borderTop: "none" }}>Refreshing…</div>}
      <div style={{ position: "fixed", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
        <div style={{ position: "absolute", width: 500, height: 500, borderRadius: "50%", background: "radial-gradient(circle, rgba(21,152,203,.18) 0%, transparent 65%)", top: "-150px", right: "-150px", animation: "orbFloat1 12s ease-in-out infinite" }} />
        <div style={{ position: "absolute", width: 400, height: 400, borderRadius: "50%", background: "radial-gradient(circle, rgba(241,138,0,.12) 0%, transparent 65%)", bottom: "80px", left: "-100px", animation: "orbFloat2 15s ease-in-out infinite" }} />
        <div style={{ position: "absolute", width: 300, height: 300, borderRadius: "50%", background: "radial-gradient(circle, rgba(0,200,180,.08) 0%, transparent 65%)", bottom: "-80px", right: "20%", animation: "orbFloat3 10s ease-in-out infinite" }} />
      </div>
      <div style={{ position: "sticky", top: 0, zIndex: 8, background: "rgba(255,255,255,.06)", backdropFilter: "blur(20px) saturate(150%)", WebkitBackdropFilter: "blur(20px) saturate(150%)", borderBottom: "1px solid rgba(255,255,255,.12)", boxShadow: "0 2px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.15)", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 18px", animation: "slideDown .2s ease-out" }}>
        {st.champion
          ? <span style={{ fontSize: 11, fontWeight: 700, color: P.amber }}>🏆 Season Complete</span>
          : st.seedingPhaseEnded
            ? <span style={{ fontSize: 11, fontWeight: 700, color: P.orange }}>Bracket</span>
            : st.cycleStart
              ? <span style={{ fontSize: 11, fontWeight: 700, color: P.orange }}>Round {st.cycleNumber} of {SEEDING_ROUNDS} · Seeding</span>
              : <span style={{ fontSize: 11, color: P.dim }}>DRA Pool</span>}
        {st.cycleStart && !st.seedingPhaseEnded ? <span style={{ fontSize: 11, color: P.off }}>{cd.d}d {cd.h}h {cd.m}m left</span> : <span />}
        <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
          <button onClick={forceRefresh} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, padding: "2px 4px", opacity: .45, lineHeight: 1, transition: "transform .3s", transform: refreshing ? "rotate(360deg)" : "none" }}>↻</button>
          <button onClick={() => setShowQR(true)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, padding: "2px 4px", opacity: .45, lineHeight: 1 }}>📷</button>
          {!SPECTATOR && <button onClick={() => { setView("admin"); setNavIdx(-1); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 18, padding: "2px 4px", opacity: .45, lineHeight: 1 }}>🔒</button>}
        </div>
      </div>
      {showQR && (
        <div onClick={() => setShowQR(false)} style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,10,20,.96)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 20, animation: "fadeIn .2s" }}>
          <p style={{ fontSize: 13, fontWeight: 700, color: P.orange, letterSpacing: 3, textTransform: "uppercase" }}>Join the League</p>
          <div style={{ background: "#fff", borderRadius: 16, padding: 16 }}>
            <img src={"https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(window.location.href)} width={260} height={260} alt="QR Code" style={{ display: "block", borderRadius: 4 }} />
          </div>
          <p style={{ fontSize: 11, color: P.dim }}>Tap anywhere to close</p>
        </div>
      )}
      <main style={{ maxWidth: 600, margin: "0 auto", padding: "0 14px 130px", animation: "fadeIn .3s", position: "relative", zIndex: 1 }}>
        {view === "home" && <Home st={st} ladder={activeLad} gn={gn} ini={ini} cd={cd} requestJoin={requestJoin} />}
        {view === "boxes" && <BoxesV st={st} gn={gn} ini={ini} logR={logR} ffM={ffM} />}
        {view === "matches" && <MatchesV st={st} gn={gn} logR={logR} ffM={ffM} />}
        {view === "bracket" && <BracketV st={st} gn={gn} ladder={ladder} recordBracketMatch={recordBracketMatch} isAdmin={!SPECTATOR} />}
        {view === "checkin" && <CheckInV st={st} ladder={ladder} togCI={togCI} selLast={selLast} autoOpen={checkInFocus} onAutoOpenDone={() => setCheckInFocus(false)} />}
        {view === "rules" && <RulesV />}
        {view === "admin" && <AdminV st={st} ladder={ladder} previewCyc={previewCyc} confirmCyc={confirmCyc} completeCyc={completeCyc} endEarlyCyc={endEarlyCyc} undoCyc={undoCyc} resetAll={resetAll} addP={addP} rmP={rmP} ffM={ffM} gn={gn} save={save} togCI={togCI} approvePlayer={approvePlayer} rejectPlayer={rejectPlayer} endSeedingPhase={endSeedingPhase} undoBracket={undoBracket} backupNow={backupNow} />}

function Home({ st, ladder, gn, ini, cd, requestJoin }) {
  const [showJoinPicker, setShowJoinPicker] = useState(false);

  const [exp, setExp] = useState(null);
  const [profileId, setProfileId] = useState(null);
  const [tieExplain, setTieExplain] = useState(null);
  const explainTie = (a, b) => {
    if (a.points !== b.points) return null;
    const h2h = getH2H(a.id, b.id, st);
    if (h2h && h2h.w1 !== h2h.w2) return gn(a.id) + " leads H2H " + h2h.w1 + "-" + h2h.w2;
    if (a.wins !== b.wins) return gn(a.id) + " has more wins (" + a.wins + " vs " + b.wins + ")";
    if (a.rw !== b.rw) return gn(a.id) + " has more racks won (" + a.rw + " vs " + b.rw + ")";
    return "Tied on all tiebreakers";
  };
  const [activeOnly, setActiveOnly] = useState(false);

  // ─── Bracket-phase view of the standings ──────────────────────────────────
  // Once the bracket is built, the home page should show players ranked by
  // their entry seed (not by ongoing seeding points, which are frozen) and
  // tag each player with their elimination status: champion, still in, or
  // eliminated in round N.
  const bracketInfo = useMemo(() => {
    if (!st.bracket || !st.seedingPhaseEnded) return null;
    const info = {};
    // Seed everyone in the bracket
    (st.bracket.seeds || []).forEach(s => {
      if (s.id) info[s.id] = { seed: s.seed, status: "in", eliminatedInRound: null };
    });
    // Walk through rounds. Loser of a completed (non-bye) match is eliminated.
    (st.bracket.rounds || []).forEach((round, ri) => {
      round.matches.forEach(m => {
        if (!m.completed || m.isBye) return;
        const loserId = m.winner === m.p1 ? m.p2 : m.p1;
        if (loserId && info[loserId]) {
          info[loserId].status = "eliminated";
          info[loserId].eliminatedInRound = ri + 1;
        }
      });
    });
    // Champion overrides any "still in" — pull from st.champion if crowned
    if (st.champion && info[st.champion.id]) {
      info[st.champion.id].status = "champion";
    }
    return info;
  }, [st.bracket, st.seedingPhaseEnded, st.champion]);

  // Compose displayLad. During seeding phase: rank by live points (existing).
  // During bracket phase: rank by bracket seed (frozen snapshot), but only show
  // players who actually made it into the bracket.
  const displayLad = useMemo(() => {
    if (bracketInfo) {
      // Bracket phase — rank by seed (lower seed = higher rank)
      const inBracket = ladder.filter(s => bracketInfo[s.id]);
      return inBracket.sort((a, b) => bracketInfo[a.id].seed - bracketInfo[b.id].seed);
    }
    return ladder.filter(s => s.mp > 0 && (activeOnly ? !s.inactive : true));
  }, [ladder, bracketInfo, activeOnly]);

  // Round label for elimination tags ("OUT R1", "OUT QF", etc.)
  const eliminationRoundLabel = (ri) => {
    if (!st.bracket) return "OUT";
    const total = st.bracket.rounds.length;
    if (ri === total) return "FINALIST";       // lost the final
    if (ri === total - 1) return "OUT SF";     // lost the semi
    if (ri === total - 2) return "OUT QF";     // lost the quarter
    if (ri === total - 3) return "OUT R16";    // lost round of 16

  const eloData = useMemo(() => calcElo(st.players, st), [st]);
  const prevElo = useMemo(() => { const prevSt = { ...st, boxMatches: [] }; return calcElo(st.players, prevSt); }, [st]);
  const ELO_MIN = 3;

  const eloRank = {}; eloRanked.forEach((p, i) => { eloRank[p.id] = i + 1; });
  const getS = (bm, p1, p2) => { const m = bm.find(m => (m.player1 === p1 && m.player2 === p2) || (m.player1 === p2 && m.player2 === p1)); if (!m) return null; if (!m.completed) return { pending: true }; return { s1: m.player1 === p1 ? m.score1 : m.score2, s2: m.player1 === p1 ? m.score2 : m.score1 }; };

  const getPlayerHistory = (pid) => {
    const results = [];
    const collect = (matches, typeLabel) => {

        const isP1 = m.player1 === pid;
        const myScore  = isP1 ? m.score1 : m.score2;
        const oppScore = isP1 ? m.score2 : m.score1;
        const oppId    = isP1 ? m.player2 : m.player1;
        results.push({ id: m.id, oppName: gn(oppId), typeLabel, won: myScore > oppScore, myScore, oppScore, completedAt: m.completedAt || "", forfeit: !!m.forfeit });
      });

    [...(st.pastCycles || [])].reverse().forEach(c => { collect(c.boxMatches, "Box"); });
    // Also include bracket matches (live in a separate data structure)
    const bracketCollect = (m) => {

      if (m.p1 !== pid && m.p2 !== pid) return;
      const isP1 = m.p1 === pid;

      const oppScore = isP1 ? m.score2 : m.score1;
      const oppId    = isP1 ? m.p2 : m.p1;

    };

    return [
      { icon: "\ud83c\udfc6", label: "Most Wins", name: mostWins.name, value: mostWins.wins + "W" },
      highElo ? { icon: "\ud83d\udcc8", label: "Highest ELO", name: gn(highElo[0]), value: highElo[1] } : null,
      { icon: "\ud83d\udd25", label: "Hot Streak", name: hotStreak.name, value: hotStreak.streak + "W" },

                  <span style={{ flex: 1, fontWeight: isChamp ? 700 : (i < 3 ? 600 : 400), fontSize: 12 }}>

                    {!bracketInfo && <StreakBadge streak={s.streak} />}
                    {!bracketInfo && s.inactive && <span style={{ fontSize: 8, fontWeight: 700, color: P.bad, background: "rgba(248,113,113,.15)", border: "1px solid rgba(248,113,113,.35)", borderRadius: 4, padding: "1px 4px", marginLeft: 4, letterSpacing: .5 }}>NO PLAY</span>}
                    {!bracketInfo && !s.inactive && s.atRisk && <span style={{ fontSize: 8, fontWeight: 700, color: P.amber, background: "rgba(255,173,51,.15)", border: "1px solid rgba(255,173,51,.35)", borderRadius: 4, padding: "1px 4px", marginLeft: 4, letterSpacing: .5 }}>AT RISK</span>}
                  </span>
                  {bracketInfo ? (
                    <>
                      <span style={{ width: 78, fontSize: 9, fontWeight: 800, letterSpacing: 0.8, textAlign: "center" }}>

                        {isStillIn && <span style={{ color: P.ok, background: "rgba(52,211,153,.15)", border: "1px solid rgba(52,211,153,.4)", borderRadius: 4, padding: "2px 6px" }}>STILL IN</span>}
                        {isOut && <span style={{ color: P.bad, background: "rgba(248,113,113,.1)", border: "1px solid rgba(248,113,113,.3)", borderRadius: 4, padding: "2px 6px" }}>{eliminationRoundLabel(br.eliminatedInRound)}</span>}
                      </span>

                {exp === s.id && (() => {

                        {s.noPlayedRounds > 0 && !s.inactive && <span style={{ fontSize: 11, color: P.dim }}>{s.noPlayedRounds} round{s.noPlayedRounds !== 1 ? "s" : ""} missed</span>}
                      </div>
                      {(eloData.played[s.id] || 0) >= ELO_MIN ? (
                        <div style={{ marginBottom: 8 }}>
